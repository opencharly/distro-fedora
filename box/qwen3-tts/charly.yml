qwen3-tts:
    candy:
        # Plain Fedora base, NOT `nvidia`: torch's cu130 wheels carry their own CUDA
        # runtime and the DRIVER arrives through CDI at runtime, so no CUDA layer is
        # needed. It also sidesteps this repo's `nvidia` pin, which predates the
        # `cuda-cccl-devel` fix and currently fails to build (#110).
        base: fedora
        platform:
            - linux/amd64
        candy:
            - '@github.com/opencharly/pod-qwen3-tts:v2026.318.2246'
        # No box-level check PLAN: the candy's own plan proves the server script and
        # that the pixi environment imports torch/soundfile/qwen_tts — one candy check
        # covers every box composing it. The composed IMAGE is proven by the disposable
        # bed `check-qwen3-tts-pod` in this repo's charly.yml.
