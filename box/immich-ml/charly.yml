immich-ml:
    candy:
        base: fedora
        platform:
            - linux/amd64
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.274.0608'
            - '@github.com/opencharly/layer-nodejs:v2026.272.0322'
            - '@github.com/opencharly/layer-cuda:v2026.274.0643'
            - '@github.com/opencharly/layer-python-ml:v2026.274.0754'
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
            - '@github.com/opencharly/layer-vectorchord:v2026.273.1836'
            - '@github.com/opencharly/pod-redis:v2026.272.0226'
            - '@github.com/opencharly/pod-immich-ml:v2026.274.0811'
            - '@github.com/opencharly/pod-dbus:v2026.274.0648'
        plan:
            - check: command=supervisorctl status postgresql redis immich-server immich-ml | awk '{print $2}' | sort -u
              id: immich-ml-services-running
              exit_status: 0
              stdout:
                - RUNNING
              context:
                - runtime
              command:
                command: supervisorctl status postgresql redis immich-server immich-ml | awk '{print $2}' | sort -u
                in_container: true
