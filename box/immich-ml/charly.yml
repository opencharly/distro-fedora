immich-ml:
    candy:
        base: fedora
        platform:
            - linux/amd64
        candy:
            - '@github.com/opencharly/charly/candy/agent-forwarding:v2026.231.0714'
            - '@github.com/opencharly/layer-nodejs:v2026.235.2056'
            - '@github.com/opencharly/layer-cuda:v2026.235.2121'
            - '@github.com/opencharly/charly/candy/python-ml:v2026.231.0714'
            - '@github.com/opencharly/layer-supervisord:v2026.235.2056'
            - '@github.com/opencharly/charly/candy/postgresql:v2026.231.0714'
            - '@github.com/opencharly/charly/candy/vectorchord:v2026.231.0714'
            - '@github.com/opencharly/charly/candy/redis:v2026.231.0714'
            - '@github.com/opencharly/charly/candy/immich:v2026.231.0714'
            - '@github.com/opencharly/charly/candy/immich-ml:v2026.231.0714'
            - '@github.com/opencharly/pod-dbus:v2026.235.2115'
        plan:
            - check: command=supervisorctl status postgresql redis immich-server immich-ml | awk '{print $2}' | sort -u
              id: immich-ml-services-running
              exit_status: 0
              stdout:
                - RUNNING
              context:
                - runtime
              command:
                command: supervisorctl status postgresql redis immich-server immich-ml | awk '{print $2}' | sort -u
                in_container: true
