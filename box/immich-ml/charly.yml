immich-ml:
    candy:
        base: fedora
        platform:
            - linux/amd64
        candy:
            # ONE SOURCE per layer (opencharly/charly#739, operator ruling): `pod-immich-ml`
            # provides pod-immich (→ layer-nodejs/-supervisord, pod-postgresql, pod-redis),
            # `pod-dbus` provides layer-supervisord, and `layer-vectorchord` provides
            # pod-postgresql — so none of those are re-listed here.
            - '@github.com/opencharly/layer-agent-forwarding:v2026.243.0408'
            - '@github.com/opencharly/layer-cuda:v2026.239.1557'
            - '@github.com/opencharly/layer-python-ml:v2026.240.0122'
            - '@github.com/opencharly/layer-vectorchord:v2026.272.0414'
            - '@github.com/opencharly/pod-immich-ml:v2026.272.0102'
            - '@github.com/opencharly/pod-dbus:v2026.239.1555'
        plan:
            - check: command=supervisorctl status postgresql redis immich-server immich-ml | awk '{print $2}' | sort -u
              id: immich-ml-services-running
              exit_status: 0
              stdout:
                - RUNNING
              context:
                - runtime
              command:
                command: supervisorctl status postgresql redis immich-server immich-ml | awk '{print $2}' | sort -u
                in_container: true
