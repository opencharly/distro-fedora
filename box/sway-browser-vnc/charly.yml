sway-browser-vnc:
    candy:
        # Minimal Sway desktop + wayvnc (VNC) + Chrome (CDP) on the Fedora base.
        base: fedora
        builder:
            pixi: fedora-builder
            npm: fedora-builder
            cargo: fedora-builder
        platform:
            - linux/amd64
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.243.0408'
            # ONE SOURCE per layer (opencharly/charly#739, operator ruling): the
            # desktop meta-layer `layer-sway-desktop-vnc` provides `pod-dbus`
            # transitively (pod-sway-desktop → pod-sway → pod-dbus), so `pod-dbus`
            # is not re-listed. `pod-dbus` pins `layer-supervisord:v2026.239.1300`,
            # so it is the single source for both `pod-dbus` and the init candy.
            - '@github.com/opencharly/layer-sway-desktop-vnc:v2026.272.0423'
        # No box-level check: the full browser-VNC desktop verification (sway/wayvnc/
        # chrome binaries + the running cdp/vnc/wl/dbus/framebuffer probes) belongs
        # to candy/sway-desktop-vnc — the composite candy that assembles the
        # desktop — so one check set covers every box composing it.
