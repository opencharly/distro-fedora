fedora-test:
    candy:
        base: fedora
        # Builder maps do NOT cross the `charly` namespace boundary; testapi carries
        # a pixi.toml, so route pixi (plus the standard npm/cargo) to main's
        # fedora-builder under the `charly` namespace.
        builder:
            pixi: fedora-builder
            npm: fedora-builder
            cargo: fedora-builder
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.271.1839'
            - '@github.com/opencharly/pod-traefik:v2026.272.0326'
            - '@github.com/opencharly/pod-testapi:v2026.272.0335'
