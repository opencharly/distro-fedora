nvidia-cdi:
    candy:
        # GPU base: Fedora + RPM Fusion (fedora-nonfree) + the GPU runtime
        # (nvidia layer: driver libs + nvidia-container-toolkit/CDI) + the CUDA
        # toolkit (cuda layer: nvcc/cuDNN/onnxruntime). No builder map: none of
        # these layers carry a pixi/npm/cargo manifest.
        base: fedora-nonfree
        platform:
            - linux/amd64
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.274.0608'
            # The cuda layer requires a matching layer-nvidia, so the base's own
            # nvidia pin moves with it — two differing pins in one scope is a load error.
            - '@github.com/opencharly/layer-nvidia:v2026.320.1938'
            # The CDI CONTRACT (opencharly/layer-cdi): build-time assertions that no driver
            # user-space or nvidia* binary is baked, and a runtime probe that the container resolved
            # the INJECTED host driver at the running kernel module's version. The `-cdi` suffix on
            # every GPU box name is what makes that expectation visible.
            - '@github.com/opencharly/layer-cdi:v2026.321.1745'
            # v2026.290.1513 still listed `cuda-cccl-devel`, which no enabled repo provides,
            # so this base's dnf transaction failed and EVERY GPU image was unbuildable (#110).
            # v2026.314.0705 carries the fix (`cccl-devel`, measured against fedora-multimedia).
            - '@github.com/opencharly/layer-cuda:v2026.321.1520'
