nvidia-cdi:
    candy:
        # GPU POD base: Fedora + RPM Fusion (fedora-nonfree) + the CDI contract layer
        # + the CUDA toolkit (cuda layer: nvcc/cuDNN/onnxruntime). It composes no
        # driver layer — see the CDI-contract note below. No builder map: none of
        # these layers carry a pixi/npm/cargo manifest.
        base: fedora-nonfree
        platform:
            - linux/amd64
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.274.0608'
            # The CDI CONTRACT (opencharly/layer-cdi): build-time assertions that no driver
            # user-space or nvidia* binary is baked, and a runtime probe that the container resolved
            # the INJECTED host driver at the running kernel module's version. The `-cdi` suffix on
            # every GPU box name is what makes that expectation visible. The kernel module is
            # host-global and the runtime injects the driver user-space per container through the CDI
            # spec, so a VM guest composes `layer-nvidia` itself (opencharly/vm-nvidia) and this pod
            # base composes none: `nvidia-ctk` is a HOST tool and never executes in this image.
            - '@github.com/opencharly/layer-cdi:v2026.323.1618'
            # layer-cdi v2026.323.1618 requires `layer-cuda` v2026.323.1604 — the release whose
            # strip walks `/usr/lib{,32,64}` for the driver libraries AND for the
            # `nvidia`/`vdpau`/xorg trees, and whose own residue assertion walks the same three
            # layouts (opencharly/layer-cuda#28, opencharly/layer-cdi#12). Pin and require move
            # together, because two differing tags of one candy in one scope is a load error.
            # This is the Fedora venue, where `/usr/lib64` is a REAL directory rather than the
            # symlink it is on Arch/CachyOS, so the layout-scoped strip is what the bed here proves.
            - '@github.com/opencharly/layer-cuda:v2026.323.1604'
