charly-fedora:
    candy:
        base: fedora
        # Builder maps do NOT cross the `charly` namespace boundary; route the
        # standard build formats to main's fedora-builder under the `charly`
        # namespace so any pixi/npm/cargo layer added here resolves.
        builder:
            pixi: fedora-builder
            npm: fedora-builder
            cargo: fedora-builder
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.237.804'
            - '@github.com/opencharly/layer-supervisord:v2026.235.2056'
            - '@github.com/opencharly/charly/candy/charly:v2026.236.1354'
            - '@github.com/opencharly/layer-golang:v2026.235.2057'
            - '@github.com/opencharly/layer-gh:v2026.237.456'
            - '@github.com/opencharly/pod-sshd:v2026.237.558'
            - '@github.com/opencharly/layer-container-nesting:v2026.237.938'
            - '@github.com/opencharly/layer-nvidia:v2026.235.2120'
