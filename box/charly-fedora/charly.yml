charly-fedora:
    candy:
        base: fedora
        # Builder maps do NOT cross the `charly` namespace boundary; route the
        # standard build formats to main's fedora-builder under the `charly`
        # namespace so any pixi/npm/cargo layer added here resolves.
        builder:
            pixi: fedora-builder
            npm: fedora-builder
            cargo: fedora-builder
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.243.0408'
            - '@github.com/opencharly/layer-supervisord:v2026.271.1115'
            - '@github.com/opencharly/layer-charly:v2026.269.2324'
            - '@github.com/opencharly/layer-golang:v2026.239.1614'
            - '@github.com/opencharly/layer-gh:v2026.239.1624'
            - '@github.com/opencharly/pod-sshd:v2026.239.1637'
            - '@github.com/opencharly/layer-container-nesting:v2026.267.1829'
            - '@github.com/opencharly/layer-nvidia:v2026.271.1114'
