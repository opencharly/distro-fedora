charly-fedora:
    candy:
        base: fedora
        # Builder maps do NOT cross the `charly` namespace boundary; route the
        # standard build formats to main's fedora-builder under the `charly`
        # namespace so any pixi/npm/cargo layer added here resolves.
        builder:
            pixi: fedora-builder
            npm: fedora-builder
            cargo: fedora-builder
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.271.1839'
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
            - '@github.com/opencharly/layer-charly:v2026.274.0345'
            - '@github.com/opencharly/layer-golang:v2026.272.0137'
            - '@github.com/opencharly/layer-gh:v2026.272.0136'
            - '@github.com/opencharly/pod-sshd:v2026.272.0324'
            - '@github.com/opencharly/layer-container-nesting:v2026.271.2309'
            - '@github.com/opencharly/layer-nvidia:v2026.271.1817'
