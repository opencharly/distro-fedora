immich:
    candy:
        base: fedora-nonfree
        platform:
            - linux/amd64
        candy:
            # ONE SOURCE per layer (opencharly/charly#739, operator ruling): the composed
            # pod `pod-immich` provides layer-nodejs / layer-supervisord / pod-postgresql /
            # pod-redis, `pod-dbus` provides layer-supervisord, and `layer-vectorchord`
            # provides pod-postgresql — so none of those are re-listed here.
            - '@github.com/opencharly/layer-agent-forwarding:v2026.243.0408'
            - '@github.com/opencharly/layer-vectorchord:v2026.272.0414'
            - '@github.com/opencharly/pod-immich:v2026.251.1422'
            - '@github.com/opencharly/pod-dbus:v2026.239.1555'
