fedora-rpmfusion:
    candy:
        # The minimal Fedora gate for `layer-rpmfusion` — deliberately NOT a coder or
        # demo workstation. Its whole job is to keep RPM Fusion's only live proof alive
        # once the non-CachyOS workload beds retire (opencharly/opencharly#1068).
        #
        # WHY A FEDORA IMAGE IS UNAVOIDABLE HERE: RPM Fusion is a Fedora package
        # repository, and layer-rpmfusion drives it end-to-end with `dnf install
        # distribution-gpg-keys`, `rpmkeys --import` and
        # `rpmfusion-{free,nonfree}-release-$(rpm -E %fedora).noarch.rpm`. There is no
        # Arch/CachyOS analogue, so the candy cannot be compensated on the CachyOS base
        # the way the six coder candies are (that is `cachyos-coder`, in
        # opencharly/distro-cachyos). This is the one remaining non-CachyOS workload the
        # cutover keeps on purpose, and it is minimal on purpose.
        #
        # `base: fedora-nonfree` is what composes the candy: that BOX owns the
        # layer-rpmfusion pin, so this image inherits the whole rpmfusion check set
        # through its base chain rather than restating the ref (R2).
        base: fedora-nonfree
        platform:
            - linux/amd64
        description: |
            The minimal RPM Fusion gate — a Fedora image whose only reason to exist is to
            prove `layer-rpmfusion` live once every other Fedora workload bed retires.
            It composes pod-sshd so the pod has a long-running service to deploy and probe;
            everything else arrives through the `fedora-nonfree` base chain, which owns the
            `layer-rpmfusion` pin and therefore the candy's check set — both release packages
            in the rpm database, both `.repo` definitions on disk, the free repo's section
            header, and the FREE signing key imported and queryable via `rpm -q gpg-pubkey`.
            Exactly ONE key check exists in the candy (measured: the run's six rpmfusion checks
            name `RPM Fusion free signing key` and no nonfree equivalent), so this says one key
            rather than the "two signing keys" an earlier draft claimed. Not a
            developer image, not a demo: one candy, one service, one gate.
        candy:
            - '@github.com/opencharly/pod-sshd:v2026.272.0324'
        # No box-level plan: the rpmfusion claims belong to the candy (which the base box
        # pins and this image inherits), and the sshd claim to its candy. The composed
        # IMAGE is proven by the disposable bed `check-fedora-rpmfusion-pod`.
