nvidia:
    candy:
        # GPU base: Fedora + RPM Fusion (fedora-nonfree) + the GPU runtime
        # (nvidia layer: driver libs + nvidia-container-toolkit/CDI) + the CUDA
        # toolkit (cuda layer: nvcc/cuDNN/onnxruntime). No builder map: none of
        # these layers carry a pixi/npm/cargo manifest.
        base: fedora-nonfree
        platform:
            - linux/amd64
        candy:
            # ONE SOURCE per layer (opencharly/charly#739, operator ruling): `layer-cuda`
            # provides `layer-nvidia`, so it is not re-listed (the GPU runtime arrives
            # transitively via layer-cuda).
            - '@github.com/opencharly/layer-agent-forwarding:v2026.243.0408'
            - '@github.com/opencharly/layer-cuda:v2026.239.1557'
