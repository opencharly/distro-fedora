tutorial-shell:
    candy:
        description: |-
            The teaching box behind opencharly.ai's quickstart — a minimal, real dev shell
            Composes three candies on the bare Fedora base, each chosen to demonstrate one
            distinct idea a newcomer has to learn: `ripgrep` is a pure TOOL layer (packages
            and probes, no service); `sshd` is a SERVICE layer, and the canonical
            init-polymorphism example (one `service:` list carrying both a `use_packaged:`
            systemd form and a custom `exec:` supervisord form, so the same candy runs under
            either init); `supervisord` is the container init that actually runs the service.
            Kept deliberately small: every line of this box is quoted on the documentation
            site, so it must stay readable end to end. The box's own plan asserts the
            CROSS-CANDY invariant the composed candies cannot assert individually — that the
            tool layer and the service layer landed in ONE image together.
        base: fedora
        candy:
            - '@github.com/opencharly/charly/candy/supervisord:v2026.201.0706'
            - '@github.com/opencharly/charly/candy/ripgrep:v2026.201.0706'
            - '@github.com/opencharly/charly/candy/sshd:v2026.201.0706'
        plan:
            # Cross-candy invariant: composition put the TOOL candy and the SERVICE candy
            # into the same image. Neither candy's own plan can assert this — ripgrep's
            # checks pass in any image containing ripgrep, sshd's in any image containing
            # sshd. Only the composing box can prove they arrived together, which is why
            # this check lives here and not in either candy.
            - check: composition landed both the tool candy and the service candy in one image — rg and sshd are on PATH together
              id: tutorial-shell-composition
              exit_status: 0
              stdout:
                - contains: /usr/bin/rg
                - contains: sshd
              command: command -v rg && command -v sshd
            # The composed tool actually works on this base — a real search returning a real
            # match, not merely a binary that exists. Mirrors the ripgrep candy's own probe
            # style so the two read alike on the generated reference pages.
            - check: the composed ripgrep candy really searches on the fedora base — a present pattern returns its line
              id: tutorial-shell-search-works
              exit_status: 0
              stdout:
                - contains: needle-in-haystack
              command: printf 'needle-in-haystack\nother-line\n' | rg needle
