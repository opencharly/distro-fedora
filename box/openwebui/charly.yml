openwebui:
    candy:
        base: fedora
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.274.0608'
            - '@github.com/opencharly/pod-openwebui:v2026.293.1944'
            - '@github.com/opencharly/pod-dbus:v2026.274.0648'
        # No box-level check PLAN: the openwebui-entrypoint binary + the WEBUI_ADMIN_EMAIL
        # env probe live on the openwebui candy (openwebui-entrypoint +
        # openwebui-admin-email-set), and the pixi python is proven by the candy's
        # openwebui-service running — one candy check covers every box composing it.
        # The composed IMAGE is proven by the disposable bed `check-openwebui-pod` in
        # this repo's charly.yml, which is that check set run on a real deployment.
