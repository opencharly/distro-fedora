openwebui:
    candy:
        base: fedora
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.243.0408'
            - '@github.com/opencharly/pod-openwebui:v2026.239.1557'
            - '@github.com/opencharly/pod-dbus:v2026.239.1555'
        # No box-level check: the openwebui-entrypoint binary + the WEBUI_ADMIN_EMAIL
        # env probe live on candy/openwebui (openwebui-entrypoint +
