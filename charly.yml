jupyter-ml-notebook-skill:
    skill:
        name: jupyter-ml-notebook
        family: jupyter
        owner: jupyter-ml-notebook
        description: |-
            Full CUDA ML JupyterLab box with finetuning, Ollama, and LLM course notebooks, CRDT MCP server, and real-time collaboration.
            Base: nvidia. Port 8888. Combines jupyter-ml with 37 Unsloth fine-tuning notebooks, 6 Ollama integration notebooks, and 15 LLM course notebooks.
            MUST be invoked before building, deploying, or troubleshooting the jupyter-ml-notebook box.
        content: |-
            # jupyter-ml-notebook -- GPU ML Jupyter with Fine-tuning Notebooks
            
            ## Box Definition
            
            ```yaml
            jupyter-ml-notebook:
              base: nvidia
              candy:
                - agent-forwarding
                - jupyter-ml
                - notebook-templates
                - notebook-finetuning
                - notebook-ollama
                - notebook-llm-on-supercomputers
                - notebook-openrouter
                - '@github.com/opencharly/pod-dbus'
                - charly
              ports:
                - "8888:8888"
              platforms:
                - linux/amd64
            ```
            
            ## What's Different from jupyter-ml
            
            This box is identical to `jupyter-ml` with two data candy additions:
            - `notebook-finetuning` — seeds 37 Unsloth fine-tuning notebooks into `/workspace/finetuning/`
            - `notebook-ollama` — seeds 6 Ollama integration notebooks into `/workspace/ollama/`
            
            The Ollama notebooks require a running `ollama` deployment. When deployed via `charly config ollama --update-all`, the `OLLAMA_HOST` env var is automatically injected via `env_provide` -- no manual configuration needed.
            
            ## Candy Composition
            
            - `jupyter-ml` — Tier 2 environment-owning meta-layer (PyTorch >= 2.10.0, vLLM 0.19, unsloth, LangChain, CRDT MCP via jupyter-mcp sub-candy)
            - `notebook-templates` — Starter notebooks (data candy, seeds /workspace)
            - `notebook-finetuning` — 37 Unsloth fine-tuning notebooks (data candy, seeds /workspace/finetuning/)
            - `notebook-ollama` — 6 Ollama integration notebooks (data candy, seeds /workspace/ollama/)
            - `notebook-llm-on-supercomputers` — 15 LLM course notebooks (data candy, seeds /workspace/llms_on_supercomputers/)
            - `agent-forwarding` — SSH/GPG agent forwarding
            - `dbus` — D-Bus session bus
            - `charly` — OpenCharly CLI
            
            ## Ports
            
            | Port | Service |
            |------|---------|
            | 8888 | JupyterLab + MCP endpoint at `/mcp` |
            
            ## Volumes
            
            | Name | Path | Purpose |
            |------|------|---------|
            | workspace | /workspace | Persistent notebook storage |
            | models | ~/.cache/huggingface | HuggingFace model cache (from unsloth sub-candy) |
            
            ## Data Candies
            
            | Candy | Target | Dest | Contents |
            |-------|--------|------|----------|
            | notebook-templates | workspace | *(root)* | getting-started.ipynb |
            | notebook-finetuning | workspace | finetuning/ | 37 Unsloth notebooks (SFT, GRPO, DPO, RLOO, QLoRA) |
            | notebook-ollama | workspace | ollama/ | 6 Ollama API notebooks (requests, OpenAI, ollama lib, GPU, HuggingFace, Anthropic) |
            | notebook-llm-on-supercomputers | workspace | llms_on_supercomputers/ | 15 LLM course notebooks (prompt engineering, RAG, fine-tuning) + datasets |
            
            ## File Layout in JupyterLab
            
            ```
            /workspace/
              getting-started.ipynb                    (from notebook-templates)
              finetuning/                               (from notebook-finetuning)
                .env.example
                notebooks.yaml
                00_Unsloth_Setup.ipynb
                01_FastInference_Llama.ipynb
                01_FastInference_Qwen.ipynb
                02_Vision_Training_Ministral.ipynb
                03_SFT_Training_Qwen.ipynb
                04_GRPO_Training_Qwen.ipynb
                05_DPO_Training_Qwen.ipynb
                06_Reward_Training_Qwen.ipynb
                07_RLOO_Training_Qwen.ipynb
                08_QLoRA_Alpha_Scaling_Ministral.ipynb
                ... (37 notebooks total)
              ollama/                                   (from notebook-ollama)
                notebooks.yaml
                00_Ollama_Requests.ipynb
                01_Ollama_GPU.ipynb
                02_Ollama_OpenAI.ipynb
                03_Ollama_Library.ipynb
                04_Ollama_HuggingFace.ipynb
                05_Ollama_Anthropic.ipynb
              llms_on_supercomputers/                   (from notebook-llm-on-supercomputers)
                notebooks.yaml
                datasets/
                D0_00_Bazzite_Setup.ipynb
                D1_01_Prompting_with_LangChain.ipynb
                D1_02_Prompt_templates_and_parsing.ipynb
                ... (15 notebooks total)
            ```
            
            ## Service Environment Integration
            
            This box is a **consumer** of env_provide variables from infrastructure candies:
            
            | Variable | Injected by | Value |
            |----------|------------|-------|
            | `OLLAMA_HOST` | `/charly-ollama:ollama` | `http://charly-ollama:11434` |
            
            The notebooks read `OLLAMA_HOST` via `os.getenv("OLLAMA_HOST", "http://localhost:11434")`. When ollama is deployed via `charly config ollama --update-all`, the env_provide mechanism overrides the localhost default automatically.
            
            ## Quick Start
            
            ```bash
            charly box build jupyter-ml-notebook
            charly config jupyter-ml-notebook
            charly start jupyter-ml-notebook
            charly status jupyter-ml-notebook
            charly logs jupyter-ml-notebook -f
            # JupyterLab: http://localhost:8888
            # MCP endpoint: http://localhost:8888/mcp
            
            # With bind-backed workspace (data seeded into local dir):
            charly config jupyter-ml-notebook --bind workspace=/path/to/project
            ```
            
            ## Notebook Workarounds
            
            The notebook-finetuning include compatibility fixes for current library versions:
            - **flex_attention disabled** in Ministral/Pixtral notebooks (transformers 5.5 bug)
            - **max_memory={0: "14GB"}** for Pixtral-12B notebooks (accelerate device_map estimation fix)
            - **packing=True** in all SFTConfig cells (TRL 1.0 requirement)
            - **max_prompt_length removed** from DPO notebooks (deprecated in TRL 1.0)
            
            ## Verify
            
            ```bash
            charly shell jupyter-ml-notebook -c "pixi run verify-pytorch"
            charly shell jupyter-ml-notebook -c "pixi run verify-unsloth"
            charly shell jupyter-ml-notebook -c "pixi run verify-mcp"
            charly shell jupyter-ml-notebook -c "ls /workspace/finetuning/"
            charly shell jupyter-ml-notebook -c "ls /workspace/ollama/"
            charly shell jupyter-ml-notebook -c "ls /workspace/llms_on_supercomputers/"
            ```
            
            ## Related Boxes
            
            - `/charly-jupyter:jupyter-ml` — Same stack without finetuning notebooks
            - `/charly-jupyter:jupyter` — Lightweight variant (no CUDA, multi-arch)
            - `/charly-jupyter:unsloth-studio` — Unsloth Studio UI (different pixi env, same finetuning notebooks)
            
            **MCP testing:** same 3 deploy-scope `mcp:` checks as `jupyter-ml` are inherited here. See `/charly-build:charly-mcp-cmd` for the verb reference.
            
            ## When to Use This Skill
            
            MUST be invoked before building, deploying, configuring, or troubleshooting the jupyter-ml-notebook box.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

sway-browser-vnc-skill:
    skill:
        name: sway-browser-vnc
        family: selkies
        owner: sway-browser-vnc
        description: |-
            Minimal Sway desktop with VNC remote access and Chrome browser.
            Use when working with VNC desktop containers or testing the sway-desktop-vnc composition.
        content: |-
            # sway-browser-vnc
            
            Minimal Sway desktop with VNC (wayvnc on port 5900) and Chrome (CDP on port 9222).
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | fedora |
            | Candies | agent-forwarding, sway-desktop-vnc, dbus, charly |
            | Ports | 5900, 9222, 9224 |
            
            ## Quick Start
            
            ```bash
            charly box build sway-browser-vnc
            charly start sway-browser-vnc
            charly status sway-browser-vnc          # Shows all probes: supervisord, cdp, dbus, charly, sway, vnc, wl
            charly check live sway-browser-vnc --filter vnc   # run the candy's vnc: status / screenshot steps
            charly check live sway-browser-vnc --filter wl    # desktop screenshot via the wl: screenshot step
            ```
            
            ## D-Bus and Notification Support
            
            This box includes the `dbus` candy (D-Bus session bus) plus the `charly` candy, enabling:
            - the `dbus:` check verb (`notify`/`list`/`call`/`introspect`) — D-Bus interaction served out-of-process by `candy/plugin-dbus`, driving the session bus with `gdbus`
            - `charly cmd` — single command execution with desktop notification on completion
            - `charly agent terminal` — typed persistent TTY sessions, input, snapshots, and transcripts
            - `charly status` — supervisord, dbus, and charly probes
            
            ```yaml
            # author dbus: steps in the plan, run with: charly check live sway-browser-vnc --filter dbus
            notify-build-done:
                check: a desktop notification is delivered
                dbus: notify
                context: [deploy]
                text: Build Complete
                description: Image built successfully
            list-services:
                check: the notifications service is on the session bus
                dbus: list
                context: [deploy]
                stdout:
                    contains: org.freedesktop.Notifications
            ```
            ```bash
            charly cmd sway-browser-vnc "make test"    # Notifies on completion (gdbus, host-side)
            ```
            
            The notification daemon (swaync) is included via the sway-desktop metalayer.
            
            ## Overlays
            
            Fullscreen overlays for recording (via wl-overlay, included in sway-desktop):
            
            ```yaml
            # author overlay steps in the plan, run with: charly check live sway-browser-vnc --filter wl
            show-title:
                check: a fullscreen title card is shown
                wl: overlay-show
                context: [deploy]
                type: text
                text: INTRO
                name: title
            show-lower-third:
                check: a lower-third is shown
                wl: overlay-show
                context: [deploy]
                type: lower-third
                text: Speaker
                subtitle: Role
                name: lt
            show-countdown:
                check: a 3-second countdown is shown
                wl: overlay-show
                context: [deploy]
                type: countdown
                seconds: 3
                name: cd
            show-highlight:
                check: a highlight region is shown
                wl: overlay-show
                context: [deploy]
                type: highlight
                region: "430,290,510,50"
                name: hl
            show-fade:
                check: a fade-to-black outro is shown
                wl: overlay-show
                context: [deploy]
                type: fade
                color: black
                name: outro
            hide-all:
                check: all overlays are hidden
                wl: overlay-hide
                context: [deploy]
                all: true
            ```
            
            All overlay types render with true RGBA compositor transparency. See `/charly-check:wl-overlay` for the full recording workflow.
            
            ## Recording
            
            Desktop video recording via wf-recorder (included in sway-desktop) is authored as
            `record:` plan steps (the declarative verb served out-of-process by `candy/plugin-record`)
            and run with `charly check live sway-browser-vnc --filter record`:
            
            ```yaml
            sway-rec-start:
                check: a desktop recording starts
                record: start
                context: [deploy]
                record_name: demo
                record_mode: desktop
            sway-rec-stop:
                check: the desktop recording is captured
                record: stop
                context: [deploy]
                record_name: demo
                artifact: demo.mp4
            ```
            
            ## Use as Selkies Remote Desktop Client
            
            sway-browser-vnc can act as a test client for selkies-desktop, simulating how a real user would connect via browser:
            
            ```bash
            # Both containers must be running on the charly bridge network
            charly start sway-browser-vnc
            charly start selkies-desktop
            
            # Open selkies URL in sway-browser-vnc's Chrome via a cdp: open step
            # (the cdp: verb is served out-of-process by candy/plugin-cdp):
            #   cdp: open  url: https://charly-selkies-desktop:3000
            # Run with: charly check live sway-browser-vnc --filter cdp
            
            # Interact with the remote desktop:
            # Mouse: cdp: spa-click on the Selkies tab (with ~0.82x coordinate scaling)
            # Keyboard: a vnc: type step (passthrough via SPA's overlayInput)
            # Screenshots: a vnc: screenshot step (shows full client desktop with stream)
            #              a cdp: screenshot step (shows only the stream content)
            ```
            
            **Key limitations when using as a client:**
            - Super key consumed by sway (can't trigger remote labwc keybinds like Super+e)
            - Ctrl+T/W consumed by local Chrome (open/close tabs locally, not remotely)
            - Clipboard permission dialog appears on first connection — dismiss with a `vnc: key` step (`key: Return`) or CDP `Browser.grantPermissions`
            
            See `/charly-selkies:selkies-labwc` for detailed SPA interaction documentation.
            
            ## Test Coverage
            
            Latest `charly check live sway-browser-vnc` run: **84 passed, 0 failed, 1 skipped**
            (`chrome-devtools-mcp-port` references `${HOST_PORT:9224}` which isn't
            mapped here — correct skip behavior).
            
            Covers all the transitive candies: wayvnc (VNC), sway (compositor),
            chrome-sway, xdg-portal, waybar, swaync, pavucontrol, thunar,
            xfce4-terminal, pipewire, wl-screenshot-grim, wl-overlay, wf-recorder,
            desktop-fonts, fastfetch, asciinema, tmux, dbus, charly. Deploy-scope: VNC
            port 5900 reachable, Chrome CDP on port 9250→9222 with `/json/version`
            200. Box-scope: sway + wayvnc both RUNNING under supervisord.
            
            ## Related Skills
            
            - `/charly-selkies:sway-desktop-vnc`, `/charly-selkies:sway`, `/charly-selkies:wayvnc`,
              `/charly-selkies:chrome-sway`, `/charly-selkies:xdg-portal`, `/charly-infrastructure:dbus-layer`,
              `/charly-tools:charly`, `/charly-distros:agent-forwarding`
            - `/charly-check:check` — declarative testing framework (parent router for the out-of-process live-container check verbs `wl:`/`cdp:`/`vnc:`/`mcp:`/`dbus:`)
            - `/charly-check:vnc` — VNC automation on this box
            - `/charly-check:cdp` — Chrome automation (CDP on host port 9250)
            - `/charly-check:wl` — Wayland input/windows/clipboard (sway subgroup for compositor control)
            - `/charly-check:dbus` — the `dbus:` check verb (notifications/list/call/introspect, served out-of-process by `candy/plugin-dbus`)
            - `/charly-build:charly-mcp-cmd` — the box inherits 2 deploy-scope `mcp:` checks from the `chrome-devtools-mcp` candy (ping + list-tools asserting `navigate_page`/`take_screenshot`). `charly check live sway-browser-vnc --filter mcp` runs them; note the **port-publishing gotcha** — if your `charly.yml` has an explicit `port:` override that predates `chrome-devtools-mcp`, port 9224 may not be published. See `/charly-build:charly-mcp-cmd` for the fix.
            
            ## Related Boxes
            
            - `selkies-desktop` — browser-accessible remote desktop (can be accessed from sway-browser-vnc's Chrome)
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

tutorial-shell-skill:
    skill:
        name: tutorial-shell
        family: distros
        owner: tutorial-shell
        description: |-
            The teaching box quoted end to end by opencharly.ai — a minimal, real dev shell
            composing one tool candy and one service candy, with the container init injected.
            MUST be invoked before editing the tutorial-shell box, the check-tutorial-shell bed,
            or any documentation page that excerpts them.
        content: |
            # tutorial-shell
            
            The **documented example**. `tutorial-shell` exists so the quickstart and the concepts
            curriculum on [opencharly.ai](https://opencharly.ai) can quote a box that is real, builds, and is
            re-proven on every R10 roster run — instead of illustrating with YAML that nobody executes.
            
            Lives in the **`opencharly/distro-fedora`** repo (git submodule at **`box/fedora`**). Its
            `fedora` base is bare-local in the same self-contained submodule (`import: []`), and both composed
            candies are pulled by `@github` reference.
            
            ```bash
            charly -C box/fedora box build tutorial-shell
            charly -C box/fedora check run check-tutorial-shell
            ```
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | fedora |
            | Candies | ripgrep, sshd |
            | Ports | 2222 (tcp, from the sshd candy) |
            | Init | supervisord — **auto-injected**, not composed (see below) |
            | Bed | `check-tutorial-shell` (`disposable: true`, pod) |
            
            ## Why these candies
            
            Each one is there to teach exactly one thing, and the composed list is kept to two so it stays
            readable when quoted in full on a documentation page:
            
            | Candy | Teaches |
            |---|---|
            | `ripgrep` (its own repo, opencharly/layer-ripgrep) | a **tool** candy — packages plus deterministic probes, no service |
            | `/charly-coder:sshd` | a **service** candy, and the canonical init-polymorphism example: ONE `service:` list carrying both a `use_packaged:` systemd form and a custom `exec:` supervisord form |
            
            **The init is deliberately absent from that list.** Because `sshd` declares a service, charly
            resolves the init the target needs and injects it — `supervisord` for a container image, nothing
            extra for a systemd machine venue, which already has an init. Composing the init by hand is
            neither required nor correct: it would be target-blind. That is why the box teaches with two
            candies rather than three.
            
            Together they cover the whole shape of a box without any of them being a fixture: a reader can
            build this, shell into it, and use it.
            
            ## What the box's own plan asserts — and what it deliberately does not
            
            The box carries **one** `check:` step, `tutorial-shell-service-wired-into-init`: the assembled
            `/etc/supervisord.conf` contains a `[program:sshd]` block.
            
            That is the only claim composition itself produces. The injected `supervisord`'s plan proves the
            init is installed; `sshd`'s proves the daemon is installed; **neither proves sshd became a
            supervisord program**. Drop `sshd` from the composed list and the check fails: with no `service:`
            declared, nothing selects an init, so no supervisord candy is injected and no
            `/etc/supervisord.conf` is assembled to hold a `[program:sshd]` block.
            
            **Co-residence is NOT checked here, on purpose.** Every composed candy's plan runs against *this*
            image, so ripgrep's probes and sshd's probes both passing already proves both landed. A box-level
            `command -v rg && command -v sshd` would duplicate them (R3), and it would pass for the wrong
            reason — testing the candies rather than the composition. The same applies to the bed, which
            carries no `plan:` of its own.
            
            This distinction is the reason the box exists in its current shape, and it is worth preserving: a
            teaching example that restates a candy's own probe in the composing box teaches the opposite of
            the rule the site's own "the spec is the test" page states.
            
            ## Editing rule — the site quotes this file verbatim
            
            Documentation pages **excerpt** `box/tutorial-shell/charly.yml`, they do not paraphrase it. Two
            consequences:
            
            1. **Keep it readable.** Comments in the box are written for a first-time reader, not for a
               maintainer. Resist adding candies: every addition costs a line on several published pages.
            2. **A change here is a documentation change.** After editing the box, re-read the pages that
               quote it (the quickstart and the concepts curriculum) and update the surrounding prose in the
               same cutover — a quoted block that no longer matches its source is a doc-vs-reality divergence
               (R1), not a cosmetic drift.
            
            ## Related Boxes
            
            - `/charly-distros:fedora` — the parent base image
            - `/charly-distros:charly-fedora` — the next box up in size: the same shape plus the charly toolchain
            - `/charly-coder:fedora-coder` — the kitchen-sink end of the same spectrum
            
            ## Related Commands
            
            - `/charly-build:build` — build the box
            - `/charly-check:check` — the bed model and `charly check run`
            
            ## When to Use This Skill
            
            **MUST be invoked** when editing the `tutorial-shell` box, the `check-tutorial-shell` bed, or any
            opencharly.ai page that quotes them.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` entries carrying `base:`/`from:`)
            - `/charly-build:docs` — the generator that publishes this card and the box's reference page

