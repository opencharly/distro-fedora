#  opencharly/distro-fedora — the Fedora image-family, a git submodule mounted at
#  box/fedora. SELF-CONTAINED: it OWNS the full Fedora base stack locally
#  (fedora → fedora-nonfree → fedora-builder), the Fedora GPU base family
#  (nvidia / python-ml), the consumer showcase images (fedora-coder /
#  charly-fedora / fedora-test), the sway-browser-vnc desktop, and every
#  Fedora-rooted app/fixture box — all discovered under box/.
#
#  This repo VENDORS NO CANDIES: every candy is an
#  `@github.com/opencharly/<kind>-<name>:<tag>` ref to that candy's OWN repo (the
#  candy de-submodule cutover — they no longer live inside the main opencharly
#  repo, so a ref through `charly/candy/<name>` would pin a stale copy at whatever
#  charly tag it named). Bases resolve to LOCAL boxes by bare
#  name (`base: fedora`, `base: nvidia`); the build vocabulary
#  (distro/builder/init) comes from the charly binary's embedded defaults. There
#  is NO namespace import (`import: []`) — nothing here depends on the main repo
#  except the @github candy refs.
#
#  Directly buildable: `charly box build fedora-coder` (the build verb defaults to
#  this charly.yml). From the parent repo: `charly -C box/fedora box build
#  fedora-coder`, or anywhere: `charly --repo opencharly/distro-fedora box build
#  fedora-coder`.
version: 2026.261.1747
# Canonical repo identity — lets the import-namespace loader recognize this repo
# when main imports it under the `fedora` namespace to build the relocated boxes.
# The dependency is one-directional: main imports fedora; fedora imports nothing
# back (the former two-way main↔fedora import is dissolved).
repo: github.com/opencharly/distro-fedora
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - rpm
    merge:
        auto: false
        max_mb: 128
# No namespace import: the fedora base stack is local; candies resolve via @github refs.
import: []
# Disposable R10 beds (kind: check, target: pod) — one per fedora consumer
# image. No bed pins a host port: every inherited container port auto-allocates
# a free 127.0.0.1 host port, so concurrent bed runs cannot collide with each
# other or with a production deploy of the same image, and a plan step reaches
# the port through ${HOST_PORT:N}. `charly check run <bed>` is the
# canonical R10 gate: build → check-image → deploy → check-live → fresh
# update → teardown, all on isolated charly-<bed>-* volumes
# (deployVolumePrefix). `disposable: true` is the sole authorization for
# the unattended destroy + rebuild.
check-fedora-coder-pod:
    pod:
        image: fedora-coder
        disposable: true
        lifecycle: dev
        description: Sole proof of the full Fedora developer image (sshd + charly-mcp + AI CLIs + language runtimes + DevOps tooling) building and running as one composed pod on the RPM Fusion base, the largest candy stack of any pod bed. Builds the fedora-coder image on fedora-nonfree (pixi/uv/npm/cargo->fedora-builder multistage), deploys it, and runs the composed candies' file/package/service/command/addr probes plus charly-mcp's mcp ping/list-tools/call.
check-charly-fedora-pod:
    pod:
        image: charly-fedora
        disposable: true
        lifecycle: dev
        description: Sole proof the minimal Fedora charly toolchain image (charly + virtualization/gocryptfs/socat + sshd + container-nesting + nvidia) builds and runs on the bare Fedora base, with charly built from source. Builds the charly-fedora pod on fedora, deploys it, and runs the charly candy's command/file probes (charly version, virsh/qemu/gocryptfs/socat present, charly doctor) plus sshd package/service/addr checks.
check-fedora-test-pod:
    pod:
        image: fedora-test
        disposable: true
        lifecycle: dev
        description: Sole proof of plain HTTP service serving — the traefik reverse-proxy + FastAPI testapi composition on the Fedora base, the only pod bed whose primary feature is plain HTTP. Builds the fedora-test pod on fedora (testapi pixi multistage), deploys it, and runs traefik+testapi baked checks — binary/file presence, service running, http probes on the traefik API port and testapi /health and /.
# check-tutorial-shell — the bed that keeps the DOCUMENTED example honest.
# box/tutorial-shell is the box quoted end to end in opencharly.ai's quickstart and
# concepts pages. Because the site excerpts it rather than paraphrasing it, this bed
# is what stops the published example from rotting: the moment the box stops
# building, stops composing, or stops reaching steady state, the R10 roster fails —
# instead of a reader discovering it by pasting a snippet that no longer works.
check-tutorial-shell:
    pod:
        image: tutorial-shell
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the DOCUMENTED teaching example — the tutorial-shell box that opencharly.ai quotes verbatim in its quickstart and concepts curriculum. Builds the two-candy box (ripgrep + sshd) on the bare Fedora base, deploys it as a pod, brings it to steady state, and does it again after a fresh rebuild. The box composes NO init: sshd declares a service:, so charly resolves the init the target needs and injects it — supervisord for this container image, nothing extra for a machine venue. The acceptance content is the composed candies' own runtime probes — sshd's service and published-port checks — PLUS the injected init's own probes, among them supervisord's control-socket check, which is the proof that an injected candy still contributes its acceptance plan and not merely its binary. The box's image-scope check asserts the wiring itself: [program:sshd] in the assembled supervisord config, a block neither composed candy produces on its own. Carries no plan: of its own. A bed earns its own steps only for a claim that needs a LIVE deployment AND that no composed candy already makes — the local example is check-sway-browser-vnc-pod, which adds cdp/wl/record probes against a running desktop. Every live claim here is already covered by the composed candies' runtime probes, so a bed plan could only duplicate them (R3), and the duplicate would pass for the wrong reason: testing the candy rather than this deployment.
# check-sway-browser-vnc-pod deploys the SHIPPING sway-browser-vnc image
# (Sway desktop + Chrome + wayvnc) on the Fedora base. The image bakes
# binaries/services/cdp/vnc/wl/dbus + mcp (chrome-devtools-mcp layer); the
# check: block adds the remaining deploy-scope probes (operator-side http, cdp
# list, wl sway-tree, record). Publishes the image's canonical 5900/9222/9224.
# sway-browser-vnc's canonical home (relocated from the retired
# opencharly/selkies submodule; its base is fedora).
check-sway-browser-vnc-pod:
    pod:
        image: sway-browser-vnc
        disposable: true
        lifecycle: dev
        description: Sole bed proving the full browser-desktop probe surface — the only deterministic source of cdp + vnc + record + dbus probes together (the richest probe-verb bed) against the Sway+Chrome+wayvnc desktop. Builds the sway-browser-vnc image on fedora, deploys it (5900/9222/9224), and runs sway-desktop-vnc's baked cdp/vnc/wl/dbus probes plus the bed's own cdp list, wl sway-tree, and record start steps.
        plan:
            - check: cdp=list
              cdp: list
              id: esbv-pod-cdp-list
              context:
                - runtime
            - check: wl=sway-tree
              wl: sway-tree
              id: esbv-pod-wl-sway-tree
              context:
                - runtime
            - check: record=start
              record:
                method: start
                record_name: check-term
                record_mode: terminal
              id: esbv-pod-record-start
              context:
                - runtime
# Relocated from main (2026-06 box inversion) with their boxes — bare local
# box refs (check-pod / jupyter / jupyter-ml now live under box/ in this
# submodule). Per-box R10 beds; the cross-deployment mechanism beds
# (check-cross-*) also live here now (below, before vm:) — their web /
# chrome-headless fixtures and the check-cross-local-driver template are
# local to this submodule.
# check-pod — the BED relocated to opencharly/plugin-pod (its subject is the pod
# runtime/mechanism that plugin owns); receiving half opencharly/plugin-pod#6,
# source-side removal this PR. `box/check-pod/` is KEPT: it is the shared
# fixture for the four remaining pod-mechanism beds below (check-addcandy-pod /
# check-stepkind-emit-pod / check-enc-pod / check-tunnel-pod), exactly as
# `web-vm` was kept for check-cross-vm-http in distro-fedora#54. Deleting the
# fixture would leave those four beds failing at image-build with
# `unknown box "check-pod"` (proven: `charly box build check-pod`).
# add_candy-on-pod overlay-deploy witness. Deploy-KEY (check-addcandy-pod) differs
# from image-NAME (check-pod) — the precise condition under which the pod overlay
# (`<deploy-key>-overlay` + the `<deploy-key>:<calver>` alias, carrying the
# add_candy marker layer) may diverge from what `charly config <deploy-key>`
# resolves to deploy (it resolves the running image via the deploy's `image:`
# field — the BASE short-name). The bed RDD-settles whether the overlay (with the
# add_candy layer) actually deploys: it overlays the @github pod-addcandy-marker
# layer (a /etc/pod-addcandy-marker file-write AND a copy: of copied.dat to
# /etc/pod-addcandy-copied, built from the LOCAL superproject tree via the bed
# runner's auto CHARLY_REPO_OVERRIDE — the :vTAG is ignored), then asserts BOTH
# markers are present INSIDE the running container. The write: leg proves the
# overlay deployed (PASS iff the overlay deployed; FAIL iff the base check-pod
# image deployed instead — the quirk); the copy: leg additionally proves the
# REMOTE add_candy candy's source tree was STAGED into .build/_candy/<name>.<version>/
# (a copy: emits `COPY --from=<candy>` against the per-candy `FROM scratch AS
# <candy>` context stage, whose COPY source is that staged dir) — without the
# staging the overlay BUILD itself fails at `COPY .build/_candy/…: no such file`,
# the write:-only marker never referenced the scratch stage so never exercised it.
# Reuses the already-built check-pod image so the bed stays light.
check-addcandy-pod:
    pod:
        image: check-pod
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the add_candy-on-pod overlay-deploy path when deploy-key != image-name. A disposable pod bed whose deploy-key (check-addcandy-pod) differs from its image-name (check-pod) and which add_candy-overlays the pod-addcandy-marker layer (a /etc/pod-addcandy-marker file-write carrying POD-ADDCANDY-MARKER-OK AND a copy: of copied.dat to /etc/pod-addcandy-copied carrying POD-ADDCANDY-COPIED-OK). It asserts both files are present inside the RUNNING container — the write: leg proves the `<deploy-key>-overlay` image (which carries the add_candy layer) is the image `charly config`/`charly start` actually deployed (fails if the BASE check-pod image, without the markers, was deployed instead), and the copy: leg additionally proves the REMOTE add_candy candy's source tree was staged into the overlay build (`.build/_candy/<name>.<version>/`) so the per-candy scratch-stage COPY resolved. Reuses the already-built check-pod image so the bed stays light.
        add_candy:
            - '@github.com/opencharly/layer-pod-addcandy-marker:v2026.239.1636'
        plan:
            - check: the pod-addcandy marker file is present inside the running container — proves the add_candy overlay actually deployed, not the base image
              id: addcandy-marker-deployed
              context:
                - runtime
              file:
                file: /etc/pod-addcandy-marker
                exists: true
                contains:
                    - contains: "POD-ADDCANDY-MARKER-OK"
            - check: the pod-addcandy COPIED data file is present inside the running container — proves the REMOTE add_candy candy's copy-verb source was staged into the overlay build (.build/_candy/name.version) so the per-candy scratch-stage COPY resolved, and the overlay deployed
              id: addcandy-copied-deployed
              context:
                - runtime
              file:
                file: /etc/pod-addcandy-copied
                exists: true
                contains:
                    - contains: "POD-ADDCANDY-COPIED-OK"
# check-stepkind-emit-pod — R10 witness for the F-STEP-EMIT BUILD leg: the pod-overlay
# OCITarget open external-step arm that BAKES a class:step plugin's build-context Containerfile
# fragment. A disposable pod bed reusing the check-pod image that add_candy-overlays TWO
# @github main-repo candies: plugin-example-stepkind (the out-of-tree class:step plugin
# declaring StepContract{emits:true} + serving OpEmit) and stepkind-build-consumer (a candy
# with a BUILD-context `run: plugin: examplestepkind` step). At the overlay build, charly
# lowers the run-step to an external step ("external:examplestepkind"), OCITarget.emitExternalStep
# consults the plugin's declared Emits=true, Invokes its OpEmit, and splices the returned
# Containerfile RUN — baking /etc/examplestepkind-build-baked (carrying STEPKIND-BUILD-BAKED-OK)
# into the overlay image. The bed asserts the file is present INSIDE the running container, so it
# passes iff the OpEmit fragment baked through the OCITarget external-step arm (fails if the arm
# skipped the step or the base check-pod image, without the marker, deployed instead). The
# build-time STEP analogue of check-pod's build-context examplestep-build-baked (a VERB baked via
# emitTasks at box build) and the pod-overlay analogue of check-addcandy-pod. The bed runner's
# auto CHARLY_REPO_OVERRIDE builds the candies from the LOCAL superproject tree (the :vTAG is a
# nominal fetch coordinate). Reuses the already-built check-pod image so the bed stays light.
check-stepkind-emit-pod:
    pod:
        image: check-pod
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the F-STEP-EMIT BUILD leg — the pod-overlay OCITarget open external-step arm that bakes a class:step plugin's build-context Containerfile fragment. A disposable pod bed reusing the check-pod image that add_candy-overlays plugin-example-stepkind (the out-of-tree class:step plugin declaring StepContract emits=true + serving OpEmit) and stepkind-build-consumer (a candy with a BUILD-context run: plugin: examplestepkind step). At the overlay build charly lowers the run-step to an external step (external:examplestepkind), OCITarget.emitExternalStep consults the plugin's declared Emits=true, Invokes its OpEmit, and splices the returned Containerfile RUN — baking /etc/examplestepkind-build-baked (carrying STEPKIND-BUILD-BAKED-OK) into the overlay image. Asserts the file is present inside the RUNNING container, so it passes iff the OpEmit fragment baked through the external-step arm and the overlay (not the base check-pod image) deployed.
        add_candy:
            - '@github.com/opencharly/plugin-example-stepkind/candy/plugin-example-stepkind:v2026.237.1421'
            - '@github.com/opencharly/layer-stepkind-build-consumer:v2026.241.1216'
        plan:
            - check: the external-step OpEmit fragment baked — /etc/examplestepkind-build-baked is present inside the running container carrying STEPKIND-BUILD-BAKED-OK, proving the OCITarget external-step build-emit arm spliced the plugin's OpEmit fragment into the overlay image
              id: stepkind-emit-baked-deployed
              context:
                - runtime
              file:
                file: /etc/examplestepkind-build-baked
                exists: true
                contains:
                    - contains: "STEPKIND-BUILD-BAKED-OK"
# check-enc-pod — encrypted-volume (gocryptfs) mount path end-to-end through the
# EXTERNALIZED candy/plugin-enc (C16a). Reuses the check-pod image and adds a
# deploy-only `type: encrypted` volume; the bed's `charly config` step runs charly's
# in-core enc shim (encPlanFor host-prelift → verb:enc OpExecute), which drives
# `gocryptfs -init` then `systemd-run --scope --user gocryptfs -allow_other` on the
# host, after which the container binds the FUSE plain dir. This is the sole R10 that
# exercises the extracted plugin-enc mount mechanics end-to-end. Passphrase is
# supplied via the GOCRYPTFS_PASSWORD env hook (resolveEncPassphrase source 1) — the
# operator exports it for the run, e.g.
#   GOCRYPTFS_PASSWORD=charly-bed charly check run check-enc-pod
# The bed host needs gocryptfs + fusermount3 + a user systemd session (the `charly`
# candy's declared deps). Reuses the already-built check-pod image so the bed is light.
check-enc-pod:
    pod:
        image: check-pod
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the encrypted-volume (gocryptfs) mount path end-to-end through the externalized candy/plugin-enc (C16a). Reuses the check-pod image and adds a deploy-only type: encrypted volume (enc-data -> /home/user/.enc-data); the bed's `charly config` step runs charly's in-core enc shim (encPlanFor host-prelift -> verb:enc OpExecute), which drives `gocryptfs -init` then `systemd-run --scope --user gocryptfs -allow_other` on the host, after which the container binds the FUSE plain dir. Asserts host-side `charly config status check-enc-pod` reports the volume initialized AND mounted (encStatus, still core), and an in-container write to the mount point reads back (the FUSE-backed plain dir is bind-mounted + writable). Passphrase via the GOCRYPTFS_PASSWORD env hook (resolveEncPassphrase source 1) — export it for the run; the bed host needs gocryptfs + fusermount3 + a user systemd session.
        volume:
            - name: enc-data
              type: encrypted
              path: /home/user/.enc-data
        plan:
            - check: host-side `charly config status` reports the encrypted volume initialized AND mounted — the plugin-enc mount succeeded
              id: enc-status-mounted
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} config status check-enc-pod
                in_container: false
              stdout:
                - matches: "enc-data\\s+yes\\s+yes"
            - check: the FUSE-backed plain dir is bind-mounted into the container and writable — a written marker reads back
              id: enc-plain-writable
              context:
                - runtime
              command: "echo ENC-BED-OK > /home/user/.enc-data/charly-bed-marker && cat /home/user/.enc-data/charly-bed-marker"
              stdout:
                - contains: "ENC-BED-OK"
# check-enc-port-pod — R10 witness for the round-3 config-flow ORDERING regression (RCA'd
# 2026-07-24, team-lead, opencharly/charly#183): config_setup.go's port-resolution block runs
# BEFORE resolveDeployVolumes and writes the per-host overlay entry (ResolvedPort) the moment a
# deploy has ANY container port — so on a PORTED deploy's FIRST `charly config`, the overlay key
# already exists before the volume fallback ever inspects it. Gating that fallback on mere
# overlay-key existence (the round-2 fix) silently DROPPED a genuine project-declared `volume:`
# override in exactly this shape. check-enc-pod ALONE never exercises this: it reuses the
# check-pod image, which declares no port, so its overlay key stays absent until the volume
# fallback itself creates it — the ordering hazard is invisible there. This bed reuses the `web`
# candy instead (web-layer, port: [8080], auto-allocated host port — PORT AUTO-ALLOCATION, never
# a hardcoded host port) specifically BECAUSE it has a port, and adds its OWN project-declared
# `type: encrypted` volume override, proving BOTH: the port resolves + is reachable (the port
# block ran, same as any ported deploy) AND the encrypted volume is initialized + mounted (the
# project-declared-volume fallback still fired on this deploy's first config despite the port
# block's prior overlay write) — the exact live scenario the VolumeProjectChecked marker fixes
# (candy/plugin-deploy-pod/config_setup_helpers.go). Passphrase via the GOCRYPTFS_PASSWORD env
# hook, same as check-enc-pod; the bed host needs gocryptfs + fusermount3 + a user systemd
# session.
check-enc-port-pod:
    pod:
        image: web
        disposable: true
        lifecycle: dev
        description: >-
            R10 witness for the round-3 config-flow ordering regression (opencharly/charly#183): proves a PORTED deploy's PROJECT-declared `volume:` override still applies on its first `charly config` despite the port-resolution block running first and pre-creating the per-host overlay entry. Reuses the `web` candy (web-layer, port: [8080], auto-allocated host port) and adds a project-declared type: encrypted volume override — the companion to check-enc-pod, which alone declares no port and so never exercises this ordering hazard. Asserts BOTH the port resolves and is reachable (the port block ran, exactly as for any ported deploy) AND the encrypted volume is initialized and mounted (the project-declared-volume fallback still fired). Passphrase via the GOCRYPTFS_PASSWORD env hook (resolveEncPassphrase source 1) — export it for the run; the bed host needs gocryptfs + fusermount3 + a user systemd session. PRECONDITION (like check-enc-pod): this bed's enc secret must be pre-seeded once — `charly secrets set charly/enc check-enc-port-pod <passphrase>` — matching the GOCRYPTFS_PASSWORD value, BEFORE its first `charly check run`. Root cause (RCA'd 2026-07-24): `ResolveEncPassphrase`'s env-var branch (`sdk/deploykit/enc_passphrase.go`, source 1) never persists to the credential store the way its auto-generate branch does, so a brand-new bed's systemd-driven non-interactive re-config (`ExecStartPre`, no env var visible) cannot find the passphrase and times out after 2 minutes — a standing enc-mechanism gap tracked for the next thematic batch (mirror the auto-generate branch's `cred.Write`), not something this bed's own R10 masks: the volume-resolution fix itself is proven at the earlier `config`/mount step, independent of this precondition.
        volume:
            - name: enc-port-data
              type: encrypted
              path: /home/user/.enc-port-data
        plan:
            - check: http=http://127.0.0.1:${HOST_PORT:8080}/ — the port-resolution block ran normally for a ported deploy
              id: enc-port-web-up
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:8080}/
                status: 200
            - check: host-side `charly config status` reports the encrypted volume initialized AND mounted despite the deploy having ports — the project-declared-volume fallback was not suppressed by the port block's prior overlay write
              id: enc-port-status-mounted
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} config status check-enc-port-pod
                in_container: false
              stdout:
                - matches: "enc-port-data\\s+yes\\s+yes"
            - check: the FUSE-backed plain dir is bind-mounted into the container and writable — a written marker reads back
              id: enc-port-plain-writable
              context:
                - runtime
              command: "echo ENC-PORT-BED-OK > /home/user/.enc-port-data/charly-bed-marker && cat /home/user/.enc-port-data/charly-bed-marker"
              stdout:
                - contains: "ENC-PORT-BED-OK"
# check-tunnel-pod — the RESOURCE-FREE R10 for the externalized tunnel EXECUTION leg
# (candy/plugin-tunnel, verb:tunnel; C16b). plugin-tunnel is COMPILED INTO charly
# (compiled_plugins), so — exactly like check-enc-pod exercises the compiled-in
# plugin-enc via the host — this bed reuses the check-pod image (a minimal running pod)
# and drives verb:tunnel's creds-free `plan` dry-run on the HOST charly during check-live:
# given a wire TunnelConfig the plan method returns the EXACT tailscale/cloudflared argv
# it WOULD run WITHOUT exec, so the bed proves registry dispatch + the TunnelConfig wire
# round-trip + the moved command-building logic with ZERO tailscale/cloudflare credentials.
# The pod carries NO live `tunnel:` (a real ExecStartPost=tailscale serve on a logged-out
# host would fail steady-state). Reuses the already-built check-pod image so the bed is light.
check-tunnel-pod:
    pod:
        image: check-pod
        disposable: true
        lifecycle: dev
        description: >-
            Sole resource-free R10 for the externalized tunnel execution leg (candy/plugin-tunnel, verb:tunnel; C16b). plugin-tunnel is compiled into charly, so this bed reuses the check-pod image (a minimal running pod) and drives verb:tunnel's creds-free `plan` dry-run on the host during check-live — given a wire TunnelConfig the plan method returns the exact tailscale/cloudflared argv it would run WITHOUT exec, proving registry dispatch + the TunnelConfig wire round-trip + the moved command-building logic with ZERO tailscale/cloudflare credentials. Asserts both a tailscale (serve + funnel) and a cloudflare (ingress + run) plan. The pod carries no live tunnel: (a real ExecStartPost=tailscale serve on a logged-out host would fail steady-state).
        plan:
            - check: verb:tunnel plan builds the exact tailscale serve/funnel argv from a wire TunnelConfig — creds-free registry dispatch + config round-trip + moved argv logic
              id: tunnel-plan-tailscale
              context:
                - runtime
              tunnel:
                method: plan
                config:
                    provider: tailscale
                    box_name: check-tunnel-pod
                    ports:
                        - port: 8888
                          backend_port: 8888
                          protocol: http
                          public: false
                        - port: 443
                          backend_port: 443
                          protocol: https+insecure
                          public: true
                expect:
                    - tailscale serve --bg --https=8888 http://127.0.0.1:8888
                    - tailscale funnel --bg --https=443 https+insecure://127.0.0.1:443
            - check: verb:tunnel plan builds the cloudflare ingress rules + run command from a wire TunnelConfig — creds-free registry dispatch + config round-trip
              id: tunnel-plan-cloudflare
              context:
                - runtime
              tunnel:
                method: plan
                config:
                    provider: cloudflare
                    tunnel_name: charly-check-tunnel
                    hostname: tunnel.example.com
                    box_name: check-tunnel-pod
                    ports:
                        - port: 8080
                          backend_port: 8080
                          protocol: https
                          public: true
                expect:
                    - "ingress tunnel.example.com -> https://localhost:8080"
                    - cloudflared tunnel run charly-check-tunnel
check-jupyter-pod:
    pod:
        image: jupyter
        disposable: true
        lifecycle: dev
        description: Sole proof of the plain JupyterLab image + the jupyter_mcp Streamable-HTTP MCP server (notebook/cell tools, regression coverage) on the Fedora base. Builds the jupyter image on fedora (pixi multistage), deploys it (8888), and runs jupyter+jupyter-mcp baked checks — jupyter-lab/spaCy/workspace file checks, supervisord service, http /api, and multiple mcp ping/list-tools/call cell-manipulation round-trips.
check-jupyter-ml-pod:
    pod:
        image: jupyter-ml
        disposable: true
        lifecycle: dev
        description: Sole proof of the GPU-rooted JupyterLab ML image (spaCy + jupyterlab-quarto + llama.cpp + vLLM + CRDT MCP) building on the Fedora nvidia/CUDA base — the heaviest fedora build. Builds the jupyter-ml pod on the nvidia base (nvidia+cuda candies), deploys it (ordinary pod, no passthrough), and runs spaCy/quarto/llama-cli/vllm build-scope probes plus supervisord service, http /api, and mcp ping/list-tools/call.
# check-ollama-pod — the R10 bed for the ollama CANDY (candy/ollama), the CUDA
# backend add-on (candy/ollama-cuda) and the compiled-in command:ollama plugin
# (candy/plugin-ollama). The bed declares NO plan of its own: every step it needs
# is baked into the candies it composes — the server probes (binary/file, /api/tags
# 200, ollama --version, ollama list), the three host-side `charly ollama` steps
# that prove plugin dispatch and live API round-trips, and the CUDA backend probe.
# Authoring them on the candies rather than here is what lets the CachyOS sibling
# bed prove the same surface without repeating a line (R3). The heavy pull/persist
# proof stays with the candy's agent-check (graded by `charly check feature run`),
# keeping the deterministic bed light.
check-ollama-pod:
    pod:
        image: ollama
        disposable: true
        lifecycle: dev
        description: Sole proof the Fedora GPU ollama LLM-server image composes and serves on the NVIDIA base, that the CUDA backend is present, and that the compiled-in command:ollama plugin (candy/plugin-ollama) works end-to-end. Builds and deploys the ollama pod and runs the checks baked into the ollama, ollama-cuda and dbus candies — binary/file probes, /api/tags 200, ollama --version, ollama list, the CUDA backend library, and the host-side charly ollama help/version/list steps against the live server over the auto-allocated host port.
# charly binary install witness on a disposable Fedora Cloud VM. The charly
# candy installs the binary from the published dnf repo (the distro-repo
# mechanism, charly#388) and the composed virtualization/gocryptfs/socat layers
# install their deps. Every
# assertion is anchored on the MECHANISM: the deploy stages its own host binary
# under /tmp for its own use, so only a /usr/bin/charly-anchored probe can tell
# a real candy install from the deploy's scaffolding. The witness FAILS if the
# binary didn't land at that path or if the welded command plugins don't
# dispatch project-less. (No tailscale assertion: the charly candy scopes
# tailscale to the deb-family — on fedora it came from the removed native
# package's deps, so the post-cutover deploy does not install it.)
check-fedora-vm:
    vm:
        from: fedora-vm
        disposable: true
        lifecycle: dev
        description: Sole proof the charly toolchain installs on a Fedora Cloud 43 guest — the charly candy installs the binary from the published dnf repo (the distro-repo mechanism, charly#388), landing /usr/bin/charly; the composed virtualization/gocryptfs/socat layers install their deps. Disposable Fedora Cloud 43 libvirt VM, overlays the add_candy charly layer, then asserts charly binary + version (CHARLY-BINARY-OK) and the welded command plugins dispatching project-less (WELDED-CMD-PROJECT-LESS-OK).
        add_candy:
            - '@github.com/opencharly/layer-charly:v2026.241.1407'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            skip_incompatible: true # skip composed layers lacking a guest-format section; the charly candy's copy step + composed layers install the binary and deps
        plan:
            - check: |
                command=test -x /usr/bin/charly &&
                /usr/bin/charly version &&
                echo CHARLY-BINARY-OK
              id: charly-binary-installed
              description: charly binary installed on the guest AT /usr/bin/charly via the charly candy's copy step (the localpkg package install is removed by the remove-candy-localpkg cutover). Path-anchored deliberately — the deploy stages its OWN host binary at a versioned /tmp path for deploy use (spec/exec/charly_install.go, which never alters PATH), so an unanchored `command -v charly` passes even when the candy installed nothing and cannot discriminate the install mechanism this step names.
              stdout:
                - contains: CHARLY-BINARY-OK
              exit_status: 0
              context:
                - runtime
              command: |
                test -x /usr/bin/charly &&
                /usr/bin/charly version &&
                echo CHARLY-BINARY-OK
            - check: the welded command plugins dispatch project-less from the installed charly binary
              id: welded-command-project-less
              description: the charly binary's compiled-in command:<word> plugins (doctor/vm/clean/…) dispatch project-less from /tmp on the installed binary
              stdout:
                - contains: WELDED-CMD-PROJECT-LESS-OK
              exit_status: 0
              context:
                - runtime
              command: |
                cd /tmp &&
                /usr/bin/charly doctor 2>/dev/null | grep -q 'Summary:' &&
                echo WELDED-CMD-PROJECT-LESS-OK
            - check: the libvirt verb dispatches through the out-of-process candy/plugin-vm and lists the host libvirt domains backing this disposable VM deployment
              id: libvirt-verb-dispatches
              libvirt: list
              exit_status: 0
              context:
                - runtime
# Cross-deployment probing (pod→pod): a Chrome DRIVER pod (sibling member)
# CDP-probes a separate web-server SUBJECT pod (sibling member) over the shared
# `charly` network. Proves venue-from-position + ${HOST:<subject>} end-to-end —
# the canonical "a different kind of deployment tests another" case. Both members
# are siblings under a GROUP, brought up by foldMembers' shared deploy+check
# lifecycle (R3); the driver is an instrument, never check-live'd itself.
check-cross-pod-cdp:
    pod:
        image: web
        plan:
            - check: http=http://127.0.0.1:${HOST_PORT:8080}/
              id: web-fixture-up
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:8080}/
                status: 200
                body:
                    - contains: charly-fixture-web-content-marker
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of pod->pod cross-deployment CDP probing — a Chrome DRIVER pod (sibling member) CDP-renders a separate web SUBJECT pod (sibling member) over the shared charly net via venue-from-position + ${HOST:check-cross-pod-cdp}. The web SUBJECT pod is the bed root; the chrome DRIVER pod is a sibling member; http-checks the subject marker on the bed root, then cdp open / cdp text steps under the chrome member (venue=chrome) navigate to ${HOST:check-cross-pod-cdp}:8080 and assert the rendered fixture marker.
    chrome:
        pod:
            image: chrome-headless
            plan:
                - check: cdp=open
                  id: cdp-open-web-subject
                  cdp:
                    method: open
                    url: http://${HOST:check-cross-pod-cdp}:8080
                  eventually: 45s
                  retry_interval: 3s
                  context:
                    - runtime
                - check: cdp=text
                  id: cdp-web-fixture-rendered
                  cdp:
                    method: text
                    tab: "1"
                  # 90s, not 30s: on the concurrent 32-bed roster one wedged CDP call cycle
                  # measured 37.8s, so a 30s budget could not fit a single complete attempt and
                  # the retry_interval below bought nothing — the step failed on the clock rather
                  # than on the page. 90s leaves room for two full slow cycles plus retries.
                  eventually: 90s
                  retry_interval: 3s
                  stdout:
                    - contains: charly-fixture-web-content-marker
                  context:
                    - runtime
# Cross-deployment probing ACROSS KINDS (local→VM): a LOCAL (host) DRIVER member
# curls a web-server SUBJECT running in a VM member. The driver reaches the guest's
# nginx :80 via ${HOST:check-cross-vm-http:80} → resolveCheckEndpoint's VM branch →
# `ssh -L 127.0.0.1:<rand>:127.0.0.1:80` over the managed charly-check-cross-vm-http alias —
# the SAME host-vantage resolver check-cross-local-http uses for a pod subject;
# only the subject KIND differs (VM vs pod), so this is the cross-kind proof
# with ZERO VM-specific check code. A pod driver can't reach a host-vantage
# 127.0.0.1 (its own netns), so the generic, no-hack VM driver runs host-side.
check-cross-vm-http:
    vm:
        from: web-vm
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of cross-KIND local->VM cross-deployment probing — a host local DRIVER member reaches a web SUBJECT inside the bed-root VM via ${HOST:check-cross-vm-http:80}'s ssh -L forward (resolveCheckEndpoint VM branch), zero VM-specific check code. The web-vm subject (disposable Fedora Cloud libvirt VM running cloud-init nginx on guest :80) is the bed root; the host-driver-vm local driver is a sibling member; a curl command step under host-driver-vm (venue=host-driver-vm) against ${HOST:check-cross-vm-http:80} (ssh -L tunnel over the managed charly-check-cross-vm-http alias) asserts the vm fixture marker.
    host-driver-vm:
        local:
            from: check-cross-local-driver
            plan:
                - check: command=curl -fsS http://${HOST:check-cross-vm-http:80}/
                  id: local-driver-reaches-vm
                  eventually: 90s
                  retry_interval: 5s
                  stdout:
                    - contains: charly-fixture-vm-content-marker
                  context:
                    - runtime
                  command: "curl -fsS http://${HOST:check-cross-vm-http:80}/"
# Cross-deployment across kinds (local→pod): a LOCAL (host) DRIVER member curls a
# web-server SUBJECT pod member via its published port. Exercises a NON-pod member
# bring-up (`charly deploy add` the local driver) + venue-from-position dispatch +
# ${HOST:check-cross-local-http:8080} (host-vantage addressing of a pod subject).
check-cross-local-http:
    pod:
        image: web
        plan:
            - check: http=http://127.0.0.1:${HOST_PORT:8080}/
              id: web-fixture-up
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:8080}/
                status: 200
                body:
                    - contains: charly-fixture-web-content-marker
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of cross-KIND local->pod cross-deployment probing — a non-pod local DRIVER member reaches a web SUBJECT pod member via its published port (resolveCheckEndpoint pod branch), the pod-subject twin of check-cross-vm-http. The web SUBJECT pod (nginx :8080) is the bed root; the kind:local host-driver is a sibling member; http-checks the subject marker on the bed root directly, then a curl command step under host-driver (venue=host-driver) against ${HOST:check-cross-local-http:8080} asserts the fixture marker.
    host-driver:
        local:
            from: check-cross-local-driver
            plan:
                - check: command=curl -fsS http://${HOST:check-cross-local-http:8080}/
                  id: local-driver-reaches-web
                  eventually: 30s
                  retry_interval: 3s
                  stdout:
                    - contains: charly-fixture-web-content-marker
                  context:
                    - runtime
                  command: "curl -fsS http://${HOST:check-cross-local-http:8080}/"
# Disposable Fedora Cloud VM — the substrate for check-fedora-vm, which proves
# the charly toolchain installs on a Fedora Cloud guest (the charly candy's copy
# step lands the binary, the composed layers install their deps).
fedora-vm:
    vm:
        source:
            kind: cloud_image
            distro: fedora
            url: https://download.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-43-1.6.x86_64.qcow2
            checksum:
                type: sha256
                value: 846574c8a97cd2d8dc1f231062d73107cc85cbbbda56335e264a46e3a6c8ab2f
            base_user: fedora
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: bios
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo
# Webserver-in-a-VM SUBJECT for the local→VM cross-deployment bed
# (check-cross-vm-http): nginx serves a fixture marker on guest :80. A LOCAL
# (host) DRIVER member reaches it via ${HOST:check-cross-vm-http:80} →
# resolveCheckEndpoint's VM branch → `ssh -L 127.0.0.1:<rand>:127.0.0.1:80`
# over the managed charly-check-cross-vm-http alias (the SAME host-vantage port resolver the
# pod beds use; the guest's :80 is reached through the SSH tunnel, never
# exposed on the host — strictly more secure than a host port-forward).
# ssh.port_auto picks a free host SSH port (the existing auto-port mechanism);
# backend: libvirt so the managed-alias SSH path is exercised, not a qemu
# fallthrough.
web-vm:
    vm:
        source:
            kind: cloud_image
            distro: fedora
            url: https://download.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-43-1.6.x86_64.qcow2
            checksum:
                type: sha256
                value: 846574c8a97cd2d8dc1f231062d73107cc85cbbbda56335e264a46e3a6c8ab2f
            base_user: fedora
        disk_size: 6G
        ram: 2G
        cpu: 2
        firmware: bios
        backend: libvirt
        network:
            mode: user
        ssh:
            user: fedora
            port_auto: true
            key_source: generate
        cloud_init:
            package:
                - nginx
                - curl
                - qemu-guest-agent
            runcmd:
                - "setenforce 0 || true"
                - "sed -i 's/^SELINUX=.*/SELINUX=permissive/' /etc/selinux/config || true"
                - "echo 'charly-fixture-vm-content-marker' > /usr/share/nginx/html/index.html"
                - "systemctl enable --now nginx"
                - "systemctl enable --now qemu-guest-agent"
        libvirt:
            devices:
                channels:
                    - type: unix
                      name: org.qemu.guest_agent.0
                      path: '{{.VmStateDir}}/qga.sock'
                graphics:
                    - type: spice
                      autoport: "yes"
                      listen: 127.0.0.1
                video:
                    - model: virtio
                      heads: 1
                      accel3d: false
# =================================================================
# check-cross-local-driver — host venue for the check-cross-local-http bed's
# local DRIVER member (cross-deployment, pod→ ... no: LOCAL driver → pod
# subject). USER-level only (no sudo), so bringUpMembers applies it unattended.
# =================================================================
check-cross-local-driver:
    local:
        description: |-
            Host venue for a cross-deployment local DRIVER member
            Minimal kind:local template establishing a host venue a sibling check drives by tree position.
        candy:
            - '@github.com/opencharly/layer-check-cross-local-driver-layer:v2026.239.1625'
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
charly-fedora-skill:
    skill:
        name: charly-fedora
        family: distros
        owner: charly-fedora
        description: |-
            Fedora box with the full charly toolchain using shared candies. Rootless-first —
            runs as uid=1000 with passwordless sudo (no root, no cap_add: ALL). Same candy
            list as charly-arch. Includes NVIDIA GPU runtime.
            MUST be invoked before building, deploying, configuring, or troubleshooting
            the charly-fedora box.
        triggers:
            - "Fedora images / `fedora*` / `box/fedora` submodule (incl. the GPU base `nvidia` / `python-ml` + `sway-browser-vnc`)"
        content: |
            # charly-fedora
            
            Fedora container with the full charly toolchain. Uses almost the same
            candy list as `/charly-coder:charly-arch` — the tag system handles
            Fedora-specific packages and scripts via `rpm:` sections. Supports
            nested containers at any depth via `/charly-distros:container-nesting`.
            
            Lives in the **`opencharly/distro-fedora`** repo (git submodule at **`box/fedora`**).
            Its `fedora` base is bare-local in the same self-contained submodule
            (`import: []`) — `base: fedora`; its
            candies (incl. the `nvidia` candy) are pulled by github reference. Build from the
            submodule: `charly -C box/fedora box build charly-fedora`. Deploy-mode verbs work
            from anywhere once the image is in local storage.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | fedora (quay.io/fedora/fedora:43) |
            | Tags | `[all, rpm, fedora, fedora:43]` |
            | Layers | agent-forwarding, charly, golang, gh, sshd, container-nesting, nvidia |
            | Platforms | linux/amd64 |
            | UID / user | **1000 / user** (rootless-first) |
            | Network | host |
            | Security | layer-level only (from `/charly-distros:container-nesting`) |
            | Registry | ghcr.io/opencharly |
            
            ### Rootless-first posture
            
            Runs as uid=1000 / `user` with no added capabilities. The
            `/charly-distros:container-nesting` kernel RCA establishes that
            `unmask=/proc/*` + subuid/subgid delegation is sufficient for rootless
            nested containers + rootless libvirt VMs, so this box — like its
            power-user siblings (`/charly-coder:charly-arch`, `/charly-coder:fedora-coder`,
            `/charly-distros:githubrunner`) — needs no `cap_add: [ALL]` or
            `label=disable` / `seccomp=unconfined`.
            
            The `/charly-coder:sshd` candy installs `/etc/sudoers.d/charly-user` with
            passwordless sudo for `user`, so anything that genuinely needs root
            is one `sudo` prefix away. Default user for every process is uid=1000.
            
            Resolved OCI security label:
            
            | Field | Value |
            |---|---|
            | `cap_add` | **(empty)** |
            | `security_opt` | `[unmask=/proc/*]` (from `/charly-distros:container-nesting`) |
            | `devices` | `[/dev/fuse, /dev/net/tun]` (from `/charly-distros:container-nesting`) |
            | `privileged` | `false` |
            
            See `/charly-openclaw:openclaw-desktop` (streaming-desktop sibling) and
            `/charly-coder:fedora-coder` (kitchen-sink dev sibling) for other boxes
            sharing this posture, and `/charly-distros:container-nesting` for the
            kernel `mount_too_revealing()` RCA.
            
            ### Why still `network: host`
            
            `charly-fedora` uses host networking (unlike `charly-arch`, which uses bridge)
            so the box can reach host services and the host namespace directly.
            charly-mcp's MCP URL rewriting (`candy/plugin-mcp/resolve.go`, the host-port
            mapping via the `cc.ResolveEndpoint` reverse-leg) handles host-networked containers via
            `HostConfig.NetworkMode=host` detection (see `sdk/kit/checkvars.go`'s
            `ContainerInspection.IsHostNetworked()`), so host networking does not break
            MCP URL rewriting. If you want charly-mcp on charly-fedora, compose it
            into the candy list — it will work on either networking mode.
            
            ## What's Installed
            
            Full charly toolchain via shared candies:
            
            - **charly** — the full toolchain: charly binary + VM tools (qemu-kvm, qemu-img, libvirt tools) + gocryptfs + socat + gvisor-tap-vsock + podman-machine
            - **golang** — Go compiler (`golang-bin`)
            - **gh** — GitHub CLI + `git` + `git-lfs` (single-responsibility; see `/charly-coder:gh`)
            - **sshd** — SSH server/client (`openssh-server`, `openssh-clients`) + passwordless sudo for `user`
            - **container-nesting** — buildah, fuse-overlayfs, shadow-utils, skopeo, tailscale, libsecret + nested container config (Tailscale from `tailscale-stable` repo)
            - **nvidia** — nvidia-container-toolkit, libva-nvidia-driver (from negativo17 repo; driver libs provided by CDI at runtime)
            
            ## Lifecycle
            
            ```bash
            # Build (from the opencharly/distro-fedora submodule)
            charly -C box/fedora box build charly-fedora
            
            # Interactive shell (as uid=1000)
            charly shell charly-fedora
            
            # Run a command
            charly shell charly-fedora -c "charly version"
            charly shell charly-fedora -c "sudo -n whoami"    # root (passwordless)
            
            # Start as service
            charly start charly-fedora
            charly status charly-fedora
            charly stop charly-fedora
            ```
            
            ## Nested Containers
            
            Rootless podman works inside charly-fedora at any nesting depth. The
            `/charly-distros:container-nesting` candy provides the config + env vars +
            subuid/subgid delegation per the podman/stable recipe:
            
            ```bash
            # Level 1: run containers inside charly-fedora
            charly shell charly-fedora -c "podman run --rm quay.io/libpod/alpine:latest echo hello"
            
            # Level 2: run charly inside charly-fedora inside charly-fedora
            charly shell charly-fedora -c "charly shell charly-fedora -c 'charly version'"
            ```
            
            Use `quay.io/libpod/alpine:latest` instead of
            `docker.io/library/alpine` to dodge Docker Hub rate limits.
            
            ## GPU Support
            
            The `/charly-distros:nvidia` candy provides NVIDIA GPU runtime:
            
            - `nvidia-container-toolkit` — CDI spec generation (driver userspace libs provided by CDI at runtime, matching host kernel module)
            - `libva-nvidia-driver` — VA-API acceleration
            
            `charly` triggers CDI regeneration plugin-side (`pluginEnsureCDI` in
            `candy/plugin-preempt/holder_dispatch.go`, via `spec.GpuSwitchActionEnsureCDI` — the
            former in-core `EnsureCDI()` shim is DELETED, K-wave 2 cone R3) before launching GPU
            containers. GPU access works at any nesting depth.
            
            ## Verification
            
            ```bash
            charly shell charly-fedora -c "id"                  # uid=1000(user)
            charly shell charly-fedora -c "sudo -n whoami"      # root
            charly shell charly-fedora -c "charly version"
            charly shell charly-fedora -c "charly doctor"
            charly shell charly-fedora -c "podman info"
            charly shell charly-fedora -c "podman run --rm quay.io/libpod/alpine:latest echo OK"
            charly shell charly-fedora -c "which nvidia-ctk"
            
            # Verify OCI tags
            charly box inspect charly-fedora --format tags
            # ["all","rpm","fedora","fedora:43"]
            ```
            
            ## Unified with charly-arch
            
            Both `charly-fedora` and `/charly-coder:charly-arch` use the exact same candy
            list. The tag system (`build: [rpm]` + `distro: ["fedora:43", fedora]`
            vs `build: [pac]` + `distro: [arch]`) selects the right packages
            and scripts per distro.
            
            ## Key Candies
            
            - `/charly-tools:charly` — the full toolchain: charly binary plus VM/encryption tools
            - `/charly-distros:container-nesting` — nested rootless podman/buildah (authoritative RCA for `mount_too_revealing()` + `unmask=/proc/*`)
            - `/charly-coder:sshd` — SSH daemon + passwordless sudo for `user`
            - `/charly-coder:gh` — GitHub CLI + git + git-lfs (owns all git tooling)
            - `/charly-distros:nvidia` — NVIDIA GPU runtime
            
            ## Related Boxes
            
            - `/charly-distros:fedora` — parent base image
            - `/charly-coder:charly-arch` — Arch counterpart, same layers, same rootless posture
            - `/charly-coder:fedora-coder` — kitchen-sink dev sibling (adds coding CLIs + DevOps)
            - `/charly-openclaw:openclaw-desktop` — streaming-desktop counterpart (charly toolchain + browser-accessible Wayland); shares the rootless-first posture
            - `/charly-distros:githubrunner` — self-hosted GitHub Actions runner; same uid=1000 posture
            
            ## Related Commands
            
            - `/charly-core:shell` — open an interactive shell in charly-fedora (as uid=1000 with sudo)
            - `/charly-core:service` — manage charly-fedora as a service
            - `/charly-vm:vm` — nested libvirt VMs via `qemu:///session` (rootless)
            - `/charly-build:charly-mcp-cmd` — MCP gateway deployment patterns (if you add `charly-mcp` to the candies)
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

fedora-builder-skill:
    skill:
        name: fedora-builder
        family: distros
        owner: fedora-builder
        description: |-
            Builder image with pixi, Node.js, and C/C++ build toolchain. Used as the
            default builder for multi-stage image builds.
            MUST be invoked before building, deploying, configuring, or troubleshooting the fedora-builder box.
        triggers:
            - "Fedora images / `fedora*` / `box/fedora` submodule (incl. the GPU base `nvidia` / `python-ml` + `sway-browser-vnc`)"
        content: |
            # fedora-builder
            
            Builder image with package managers and compilation tools. Default builder for pixi, npm, and cargo multi-stage builds (declared via `builds: [pixi, npm, cargo]`).
            
            **Owned by the `opencharly/distro-fedora` submodule.** Lives bare-local in the
            **`opencharly/distro-fedora`** submodule (mounted at `box/fedora`), alongside
            `/charly-distros:fedora` + `/charly-distros:fedora-nonfree`; the submodule is
            SELF-CONTAINED (`import: []`), so its images route builders to a bare-local
            `fedora-builder`. Its `rpmfusion`/`pixi`/`nodejs`/`build-toolchain` candies are
            pinned as github refs (`@github.com/opencharly/charly/candy/<name>:<tag>`) so
            the same definition resolves in both main and the submodule. Build with
            `charly box build fedora-builder` from the submodule.
            
            ## Box Properties
            
            | Property | Value |
            |----------|-------|
            | Base | fedora |
            | Layers | rpmfusion, pixi, nodejs, build-toolchain |
            | Platforms | linux/amd64 |
            | Registry | ghcr.io/opencharly |
            
            ## Full Candy Stack
            
            1. `fedora` (quay.io/fedora/fedora:43)
            2. `rpmfusion` — RPM Fusion free + nonfree repo configuration. Applied **first** so subsequent candies can `dnf install` packages from RPM Fusion (e.g. `x264-devel`, `ffmpeg-devel`, `libva-devel`)
            3. `pixi` — pixi package manager + env paths
            4. `nodejs` — Node.js + npm
            5. `build-toolchain` — gcc, cmake, autoconf, ninja, git, pkg-config, **plus** the smithay/cargo build deps (`rust`, `cargo`, `clang-devel`, `nasm`, `wayland-devel`, `libva-devel`, `x264-devel`, `ffmpeg-devel`, `pixman-devel`, …) needed for builder-stage compilation of Wayland compositors like pixelflux. See `/charly-coder:build-toolchain` for the full grouped list.
            
            ## Why rpmfusion is first
            
            The build-toolchain candy's `dnf install` references packages that live in RPM Fusion free
            (`libva-devel`, `x264-devel`, `ffmpeg-devel`). These are required to build pixelflux from
            source (its `libva-sys`, `x264-sys`, and `ffmpeg-sys-next` cargo crates link against the
            system libs). Without rpmfusion applied first, those `dnf install` calls would fail.
            See `/charly-selkies:selkies` (Patched pixelflux build pipeline) for the consumer story.
            
            ## Role in Build System
            
            This image is referenced in `defaults.builders` as the builder for `pixi`, `npm`, and `cargo` multi-stage builds. It declares `builds: [pixi, npm, cargo]` to advertise its capabilities. The generator uses it as the `FROM` stage in multi-stage builds, providing build tools without bloating final images.
            
            ## Quick Start
            
            ```bash
            charly box build fedora-builder
            charly shell fedora-builder
            ```
            
            ## Key Candies
            
            - `/charly-languages:pixi` — Python package management foundation
            - `/charly-coder:nodejs` — Node.js runtime and npm
            - `/charly-coder:build-toolchain` — C/C++ compilation tools
            
            ## Related Boxes
            
            - `/charly-distros:fedora` — parent base
            
            ## Verification
            
            After `charly box build`:
            - `charly box list` — box appears in list
            - `charly shell fedora-builder` — interactive shell works
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves the fedora-builder box, multi-stage builds, or build cache configuration. Invoke this skill BEFORE reading source code or launching Explore agents.
            
            ## Related
            
            - `/charly-image:image` — image family umbrella (`candy:` image entries — those carrying `base:`/`from:` — in `charly.yml`, build/validate/inspect/list)
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

fedora-coder-skill:
    skill:
        name: fedora-coder
        family: coder
        owner: fedora-coder
        description: |-
            Kitchen-sink development box: coding + AI-coding CLIs + DevOps tooling
            in one container. Fedora-nonfree base, direct candies spanning language
            runtimes, build tooling, AI coding CLIs, and the full cloud/devops
            stack. Runs as uid 1000 with passwordless sudo — rootless-first, matches
            the /charly-openclaw:openclaw-desktop security posture.
            Use when working with the fedora-coder box — specifically any task that
            involves SSH-ing into a single container and having every tool a polyglot
            engineer reaches for during a working day already installed.
        triggers:
            - "Fedora images / `fedora*` / `box/fedora` submodule (incl. the GPU base `nvidia` / `python-ml` + `sway-browser-vnc`)"
        content: |-
            # fedora-coder
            
            The everyday-development counterpart to `/charly-distros:charly-fedora`: all the
            coding + AI + DevOps tooling a developer needs in one box, no desktop,
            no streaming. Distinct from `openclaw-desktop` (which adds the
            browser-streamed Wayland desktop) — `fedora-coder` is headless and
            meant to be accessed via `ssh -p 2222` or `charly shell`.
            
            > **Location:** lives in the **`opencharly/distro-fedora`** repo (git submodule at
            > **`box/fedora`**), discovered as a `box/<name>/charly.yml` box. Its base
            > stack (`fedora-nonfree` → `fedora`) is bare-local in the same self-contained
            > submodule (`import: []`) — `base: fedora-nonfree`, which itself roots on the
            > bare-local `fedora` base — and its candies are pulled by github reference.
            > Build/validate from
            > the submodule: `charly -C box/fedora box build fedora-coder`, or
            > `charly --repo opencharly/distro-fedora box build fedora-coder`. Deploy-mode verbs
            > (`charly config`/`charly start`/`charly check box`) read the built image's OCI labels and
            > work from anywhere once it's in local storage.
            
            ## Definition
            
            ```yaml
            fedora-coder:
              base: fedora-nonfree            # = fedora + rpmfusion (for x264/ffmpeg-devel)
              ports:
                - "2222:2222"                 # sshd-wrapper
                - "18765:18765"               # charly-mcp (Streamable HTTP)
              candy:
                # Baseline (matches the charly-cachyos power-user pattern)
                - agent-forwarding
                - sshd
                - charly                          # the full toolchain: charly binary + virtualization + gocryptfs + socat
                - charly-mcp                      # MCP gateway for the entire charly CLI
                - container-nesting           # rootless nested podman/buildah/skopeo
                - '@github.com/opencharly/pod-dbus'
                - '@github.com/opencharly/layer-tmux'
            
                # Language runtimes + managers
                - language-runtimes           # Go + PHP + .NET 9 + nodejs-devel + python3-devel
                - '@github.com/opencharly/layer-golang'
                - '@github.com/opencharly/layer-nodejs'  # generic nodejs candy (Node 22 on Fedora)
                - rust
                - pixi
                - uv                          # direct-download binary (no pixi env)
            
                # Build + developer tooling
                - build-toolchain
                - dev-tools                   # ripgrep, bat, fd, neovim, htop, …
                - pre-commit
                - direnv
                - gh                          # GitHub CLI + git + git-lfs (single-responsibility)
                - typst
                - asciinema
            
                # AI coding CLIs
                - claude-code
                - codex
                - '@github.com/opencharly/layer-gemini'
                - forgecode                   # 5th CLI (astral-sh-style)
                - oracle
            
                # DevOps / cloud / infra
                - devops-tools                # AWS, Scaleway, kubectx/kubens, OpenTofu
                - kubernetes                  # kubectl, helm, k3d
                - docker-ce
                - github-actions              # act, actionlint
                - google-cloud
                - google-cloud-npm            # firebase npm bindings (Gemini CLI comes from the gemini candy)
                - grafana-tools
            ```
            
            Network: default `charly` bridge. The `port:` mapping is the right way to expose
            sshd/charly-mcp, and bridge networking lets dev boxes coexist on one host via
            normal `-p host:container` remapping (e.g. running `arch-coder` alongside
            `fedora-coder` on the same machine).
            
            No `uid:` / `gid:` / `user:` / `security:` override — inherits
            `1000/1000/user` from `defaults` and the candy-level security from
            `/charly-distros:container-nesting`. Rootless-first by design (shares this
            posture with `/charly-openclaw:openclaw-desktop`).
            
            ## Resolved security posture (OCI label)
            
            | Field | Value | Source |
            |---|---|---|
            | `cap_add` | **(empty)** | — |
            | `security_opt` | `[unmask=/proc/*]` | `/charly-distros:container-nesting` |
            | `devices` | `[/dev/fuse, /dev/net/tun]` | `/charly-distros:container-nesting` |
            | `privileged` | `false` | — |
            | Network | default `charly` bridge | charly.yml |
            | UID / user | `1000 / user` | defaults |
            | sudo | passwordless via `/etc/sudoers.d/charly-user` | `/charly-coder:sshd` |
            
            **No `--privileged`. No `cap_add: ALL`. No `seccomp=unconfined`. No
            `label=disable`.** All four power-user boxes (`fedora-coder`, `charly-fedora`,
            `charly-arch`, `githubrunner`) run the rootless posture proven sufficient by the
            `container-nesting` kernel RCA — see `/charly-distros:container-nesting` for the
            `mount_too_revealing()` + `unmask=/proc/*` derivation.
            
            ## Network posture
            
            Default `charly` bridge. Bridge networking plus normal `-p host:container`
            remapping is the right pattern for dev boxes — it lets `fedora-coder` run
            alongside `/charly-coder:arch-coder` on the same host (both want sshd on 2222 and
            charly-mcp on 18765). To run two dev boxes side by side:
            
            ```bash
            charly config arch-coder -p 2223:2222 -p 18766:18765     # alt-instance ports
            charly config fedora-coder                               # canonical 2222/18765
            ```
            
            Reaching host services from inside a bridge-networked container: use
            the host's LAN IP or `host.containers.internal` (podman) rather than
            `127.0.0.1`. For selkies-style sibling-container discovery, the charly.yml
            `provides.env:` and `CHARLY_MCP_SERVERS` auto-injection give explicit hostnames.
            
            ## The 32-layer composition explained
            
            **Why `fedora-nonfree` (not plain `fedora`)** — `build-toolchain` pulls
            `x264-devel` + `ffmpeg-devel`, both of which live in RPM Fusion. Every
            box that uses `build-toolchain` either bases on `fedora-nonfree` or
            includes `rpmfusion` explicitly.
            
            **Python story** — `python` (the pixi-python charly-layer) is NOT pulled in.
            `supervisord`, `language-runtimes`, and `uv` all use system python3 from RPM,
            not the conda-forge pixi env, so none of them declares `require: python`.
            System Python is available via `language-runtimes` (`python3-devel` +
            `python3-ramalama`). See the "Key Rules" note in the project rulebook (`AGENTS.md` / `CLAUDE.md`) ("don't declare
            defensive deps").
            
            **`uv` is a direct-download binary** (no pixi involvement). Lives at
            `/usr/local/bin/uv` and `/usr/local/bin/uvx`, extracted from the
            upstream astral-sh/uv tarball via the `download:` verb's
            `strip_components: 1` modifier. See `/charly-coder:uv` and `/charly-image:layer`.
            
            **`gh` owns all git tooling** — the `gh` candy installs `gh` + `git` +
            `git-lfs` (with the noscripts + post-install trigger). `dev-tools`
            intentionally does NOT install any of these. See `/charly-coder:gh`.
            
            **No GPU by default** — `nvidia` / `cuda` intentionally NOT composed. If
            you need CUDA in your dev box, spin a sibling `fedora-coder-nvidia`
            with `base: nvidia` + the same candy list.
            
            ## Verification recipe (build + test + deploy-test)
            
            ```bash
            # 1. Validate config (from the opencharly/distro-fedora submodule)
            charly -C box/fedora box validate
            
            # 2. Build (first time ≈ 15–30 min; cached rebuilds are fast thanks to
            # LABEL-at-end ordering — test edits rebuild in seconds)
            charly -C box/fedora box build fedora-coder
            
            # 3. Build-scope tests (disposable container)
            charly check box ghcr.io/opencharly/fedora-coder:latest
            # target: 149 passed · 0 failed · 0 skipped
            
            # 4. Deploy (no bind-mount needed; charly-mcp auto-falls back to opencharly/charly)
            charly config fedora-coder
            charly start fedora-coder
            
            # 5. Full-scope tests — prefers the running container automatically
            # (see /charly-check:check "Live vs disposable executor selection")
            charly check box ghcr.io/opencharly/fedora-coder:latest
            # target: 167 passed · 0 failed · 0 skipped
            
            # 6. Clean up
            charly stop fedora-coder
            ```
            
            If you want `box.list.boxes` over the MCP surface to list YOUR
            local checkout's boxes (rather than upstream opencharly/charly),
            bind-mount the project:
            
            ```bash
            charly config fedora-coder --bind project=/home/you/opencharly
            charly start fedora-coder
            ```
            
            The volume NAME is `project` (stable bind-mount API); the in-container
            mount path is `/workspace`. See `/charly-coder:charly-mcp` for the three
            deployment patterns (bind-mount / `CHARLY_PROJECT_REPO` / auto-fallback).
            
            ## Ports
            
            | Port | Service | Bound by |
            |---|---|---|
            | 2222 | sshd-wrapper (SSH access as user with sudo) | `/charly-coder:sshd` |
            | 18765 | charly-mcp (entire `charly` CLI as MCP tools, Streamable HTTP) | `/charly-coder:charly-mcp` |
            
            Conflicts with `/charly-coder:charly-arch` (identical ports) and several
            selkies-desktop variants on 2222. Use `-i <instance>` or `-p <remap>`
            if running alongside.
            
            ## Test results
            
            - `charly check box fedora-coder` — **149 passed · 0 failed · 0 skipped**.
            - `charly check box fedora-coder` against a live running
              container — **167 passed · 0 failed · 0 skipped** (adds deploy-scope:
              sshd reachable, supervisord responding, dbus+charly-mcp+virtqemud+
              virtnetworkd services running, libvirt session list + KVM domcaps,
              mcp ping/list-tools/call-version/call-list-images via the charly-mcp
              auto-fallback).
            
            ## Image size
            
            ~14 GB uncompressed (kitchen-sink trade-off). Dominated by:
            
            - `virtualization` — QEMU + libvirt (~800 MB)
            - `docker-ce` — Docker engine + containerd + buildx + compose (~500 MB)
            - 5 AI coding CLIs — `forgecode` alone is ~370 MB (native binary); the
              JS-only ones are smaller.
            - `grafana-tools` — 7 binaries fetched from GitHub releases (~200 MB)
            - `language-runtimes` — .NET 9 SDK is ~600 MB on its own.
            
            To slim: drop the candy groups you don't need (AI CLIs, kubernetes,
            google-cloud-npm) by forking charly.yml. See `/charly-image:image` for authoring.
            
            ## Key Candies
            
            - `/charly-tools:charly` — the full toolchain: charly binary + virtualization + gocryptfs + socat (+ podman-machine, gvisor-tap-vsock for nested VMs)
            - `/charly-coder:charly-mcp` — MCP gateway; auto-falls back to `opencharly/charly` when no bind-mount present
            - `/charly-distros:container-nesting` — rootless nested podman recipe (authoritative RCA for `mount_too_revealing()` + `unmask=/proc/*`)
            - `/charly-coder:sshd` — SSH daemon + passwordless sudo for the `user` account
            - `/charly-coder:forgecode` — the 5th AI coding CLI
            - `/charly-coder:language-runtimes` — Go + PHP + .NET + nodejs-devel + python3-devel (system-python stack, no pixi)
            - `/charly-coder:uv` — direct-download binary at /usr/local/bin/uv
            - `/charly-coder:gh` — GitHub CLI + git + git-lfs (single-responsibility)
            
            ## Cross-distro siblings
            
            `fedora-coder` is one of the **cross-distro coder boxes** that share the identical `check:` block + a large set of identical candies; they diverge only in each candy's package-format section (`rpm:` / `pac:` / `deb:`) and a handful of distro-specific quirks handled inside individual candies.
            
            | Box | Base | Package mgr | User model |
            |---|---|---|---|
            | `/charly-coder:fedora-coder` | `fedora-nonfree` (Fedora 43) | rpm | `user:user` (create) |
            | `/charly-coder:arch-coder` | `arch` | pac + aur | `user:user` (create) |
            | `/charly-coder:debian-coder` | `debian:13` | deb | `user:user` (create) |
            | `/charly-coder:ubuntu-coder` | `ubuntu:24.04` | deb | `user:ubuntu` (**adopt** from base) |
            
            All four produce the same daily-dev surface (sshd on 2222, charly-mcp on 18765, AI CLIs, full language runtimes, DevOps tooling). Pick based on distro-family alignment with your team/CI. See `/charly-image:image` "user_policy" for the adopt-vs-create reconciliation that gives ubuntu-coder its `ubuntu` username.
            
            ## Related Boxes
            
            - `/charly-openclaw:openclaw-desktop` — sibling rootless-first power-user box; same security posture + container-nesting, but adds the streaming desktop. Prefer when you want browser-accessible GUI + dev tools.
            - `/charly-distros:charly-fedora` — minimal charly toolchain (no coding CLIs, no DevOps), also uid=1000 with sudo.
            - `/charly-coder:charly-arch` — Arch Linux counterpart of charly-fedora.
            - `/charly-distros:githubrunner` — self-hosted GitHub Actions runner; same uid=1000 posture.
            - `/charly-hermes:hermes` — adds the Hermes AI agent daemon on top of the AI CLIs; prefer when you want an agent, not just CLI tools.
            
            ## Related Commands
            
            - `/charly-core:shell` — open an interactive shell inside the container (as user, with sudo)
            - `/charly-core:charly-config` — deploy setup (--bind project=…, tunnel, --update-all)
            - `/charly-core:start`, `/charly-core:stop` — lifecycle
            - `/charly-check:check` — live-service tests (`charly check live <name>`) and build-scope tests (`charly check box <ref>`)
            - `/charly-build:charly-mcp-cmd` — MCP gateway documentation; `--no-default-repo` to disable auto-fallback
            - `/charly-vm:vm` — nested libvirt VMs (via virtqemud inside the container)
            - `/charly-image:layer` — authoring reference (covers the new `strip_components:` modifier)
            
            ## When to Use This Skill
            
            **MUST be invoked** when the task involves:
            
            - Building, deploying, or troubleshooting the `fedora-coder` box.
            - Picking the right power-user base image for a coding/dev workload (this
              vs. `charly-fedora` vs. `charly-arch` vs. `openclaw-desktop`).
            - Understanding the rootless-first architectural pattern shared by the
              four power-user boxes (kernel RCA belongs in
              `/charly-distros:container-nesting`; the composition that proves it works
              without a GUI is here).
            - The full MCP auto-fallback deployment pattern when the `/workspace`
              bind-mount is intentionally left empty.
            
            ## Related
            
            - `/charly-build:build` — the embedded build vocabulary (distros, builders, init-systems)

